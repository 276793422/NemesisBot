# cargo-deny 配置（H3 供应链闸，project-health v2，2026-08-31）
#
# 运行：cargo deny check（CI 走 .github/workflows/supply-chain.yml 每周 + 锁文件变更触发）
# 豁免台账（每条豁免必须有理由 + 到期日）：docs/INFO/2026-08-31_dependency-rules.md
# 本地复现：cargo deny check licenses / advisories / bans / sources

[graph]
# 检查所有 target 的依赖并集（Windows/Linux/Android/macOS），与全量构建口径一致
all-features = true

[advisories]
version = 2
# v2 schema 说明（cargo-deny 0.18+）：per-severity 字段（vulnerability/unmaintained/
# yanked/notice）已移除，级别内建——vulnerability/unmaintained = error（堵闸，必须
# 修或逐条豁免），yanked/notice = warn（只提示）。可升级修的优先 cargo update
# （2026-08-31：anyhow/crossbeam-epoch/h2/quick-xml/quinn-proto/memmap2 六包
# 升级清零全部 vulnerability）；
# 无升级路径的写进下方 ignore 豁免，与 docs/INFO/2026-08-31_dependency-rules.md
# 台账同步维护（每条必须有理由 + 复查条件）。注意 deny 扫激活依赖图而
# cargo-audit 扫 lockfile 全集，两道闸互补（见台账 §3.1 双闸差异教训）。
ignore = [
  # ===== 无升级路径的 unmaintained（全部为编译期/构建期依赖，无运行时不可信输入暴露）=====
  # gtk3-rs 全家（2024 年归档，RUSTSEC-2024-0412/0413/0415/0416/0418/0419/0420）。
  # 传递链：tray-icon → libappindicator → gtk 0.18（Linux 系统托盘）。项目已显式
  # 决策保留 GTK3 托盘方案（GMenuModel 迁移因多数面板不支持被否决，ksni 迁移也已
  # 否决，见 docs/INFO/2026-06-10_ksni-tray-migration.md）。上游 gtk3-rs 永不再发
  # 版，等 tray-icon 生态整体迁移 gtk4 才可移除本组豁免。
  { id = "RUSTSEC-2024-0412", reason = "gtk3-rs archived (gdk); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0413", reason = "gtk3-rs archived (gdk-sys); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0415", reason = "gtk3-rs archived (gtk3-macros); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0416", reason = "gtk3-rs archived (gtk); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0418", reason = "gtk3-rs archived (gdkx11); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0419", reason = "gtk3-rs archived (gdkwayland-sys); Linux tray stack, deliberate GTK3 retention decision" },
  { id = "RUSTSEC-2024-0420", reason = "gtk3-rs archived (atk); Linux tray stack, deliberate GTK3 retention decision" },
  # proc-macro-error 维护者失联（RUSTSEC-2024-0370）。传递链：glib-macros 0.18
  # （gtk3-rs 生态，Linux 托盘链）——随 gtk3-rs 豁免一并处置；纯 proc-macro，
  # 只在编译期展开宏，无运行时暴露。上游 glib 0.20+ 已换 proc-macro-error2。
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; transitive via glib-macros (gtk3 tray chain), compile-time only" },
  # 2026-11-25 清理：移除 paste(RUSTSEC-2024-0436) / ttf-parser(RUSTSEC-2026-0192) /
  # rustls-pemfile(RUSTSEC-2025-0134) / unsafe-libyaml(RUSTSEC-2024-0449) 四条豁免。
  # cargo-deny ≥0.22 严格按公告 [affected] 段匹配，这四条公告（informational
  # unmaintained、patched 为空、无 affected 段）不再匹配图内任何 crate，逐条
  # 报 advisory-not-detected——旧版是 warning，新版语义随时可能升 error 堵闸，
  # 豁免台账必须与当前工具语义自洽，故删除（公告本身未消失，若未来工具恢复
  # 匹配再按台账流程重录）。台账：docs/INFO/2026-08-31_dependency-rules.md
  # 注意：gtk3-rs 全家 + proc-macro-error 豁免在 0.22 严格匹配下同样报
  # unmatched 警告（托盘链未进 deny 激活图，CI 0.22.0 与本地一致），暂保留
  # 作为托盘链入图时的防御豁免，待 graph 口径（all-targets）专项确认后统一处置。
  # rsa 0.9.10 Marvin Attack（RUSTSEC-2023-0071，无修复版本）。传递链：cms 0.2
  # `builder` feature 硬性捆绑 rsa（feature 列表含 rsa，default-features=false 也
  # 关不掉）← nemesis-verify（v4 CMS SignedData）。项目侧零 RSA 操作暴露：v4 全
  # 链路只用 ECDSA P-256（RFC 6979），Marvin Attack 需要 RSA 解密/signing oracle，
  # 攻击面不可达。移除条件：cms 上游把 builder 拆出 rsa，或 RustSec 出 patched
  # 版本。台账：docs/INFO/2026-08-31_dependency-rules.md（2026-09-12）
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack; hard-bundled by cms builder feature, project is ECDSA-only (no RSA oracle), no upstream fix" },
  # rustls-webpki 0.102 四联公告（RUSTSEC-2026-0049/0098/0099/0104，修复均在
  # webpki ≥0.103.10-13，跨 minor）。钉死链：rumqttc 0.25 → rustls 0.23（依赖
  # req webpki 0.102.x，0.23 系列无 0.103 重发布）→ 本项目 mqtt feature；升级
  # 需等 rumqttc 发 rustls 0.24+ 版本，属上游节奏。暴露面评估：本项目是纯
  # TLS 客户端（出站连 LLM API / MQTT broker，主流公共 CA）；0049/0104 是
  # CRL 吊销检查缺陷——webpki 的 CRL 支持是 rustls opt-in API，项目从未启用；
  # 0098/0104 是 name-constraint 缺陷——仅在被中间人 CA 误签 URI/wildcard
  # SAN 证书时可达，主流公共 CA 场景不可达。移除条件：rumqttc 升级到
  # rustls 0.24+ 后 cargo update -p rustls-webpki。台账：docs/INFO/2026-08-31_dependency-rules.md（2026-09-28）
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki CRL matching flaw; fix in webpki >=0.103.10, pinned 0.102 via rustls 0.23 (rumqttc 0.25); CRL revocation never enabled by project" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name-constraint flaw; fix in webpki >=0.103.12, pinned 0.102 via rustls 0.23 (rumqttc 0.25); reachable only via misissuing CAs" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint flaw; fix in webpki >=0.103.12, pinned 0.102 via rustls 0.23 (rumqttc 0.25); reachable only via misissuing CAs" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki reachable panic in CRL parsing; fix in webpki >=0.103.13, pinned 0.102 via rustls 0.23 (rumqttc 0.25); CRL revocation never enabled by project" },
  # rustls-webpki 0.102 emSign 中间证书缺陷（RUSTSEC-2026-0382，修复在
  # webpki ≥0.103.16，跨 minor）。锁内 0.103.x 已 cargo update 到 0.103.16；
  # 残留 0.102.8 与上方 0049/0098/0099/0104 四联公告同一条钉死链
  # （rumqttc 0.25 → rustls 0.23 → 本项目 mqtt feature，default-off）。
  # 暴露面：受影响路径需信任锚允许经被吊销 emSign 中间证书（私钥已泄露）的
  # 链——纯 TLS 客户端连主流公共 CA 端点，MITM 需持有泄露中间钥伪造 emSign
  # 链才可达。移除条件：rumqttc 升级到 rustls 0.24+/webpki ≥0.103.16 后
  # cargo update -p rustls-webpki。台账：docs/INFO/2026-08-31_dependency-rules.md（2026-10-21）
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki accepts distrusted emSign intermediates; fix in webpki >=0.103.16, 0.103.x updated in lock, 0.102.8 pinned via rustls 0.23 (rumqttc 0.25, mqtt default-off); client-only, mainstream-CA exposure" },
  # crypto-bigint 0.5.5 恒定时间运算时序可变（RUSTSEC-2026-0387，修复在
  # ≥0.7.6，跨 major）。钉死链：p256 0.13.2 / ecdsa 0.16.9 → elliptic-curve
  # 0.13.8 → crypto-bigint 0.5.x，semver 无升级路径。
  # 暴露面：nemesis-verify 签名走 RFC 6979 确定性 nonce（无可泄露随机数），
  # 用法是本机工具签名 + 自有二进制验签，无远程签名 oracle 暴露；时序攻击
  # 需对本地签名操作做大量高精度测量，实际不可达。（2026-10-24）
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability in constant-time ops; fix >=0.7.6 cross-major; pinned via p256 0.13/ecdsa 0.16 -> elliptic-curve 0.13; RFC 6979 deterministic nonce, local-only signing, no remote oracle exposure" },
  # chrono / chrono-tz 上游公告 unmaintained（RUSTSEC-2026-0543 / -0555，
  # chronotope/chrono#1768，无修复版本、影响全版本）。chrono 是 workspace
  # 时间基础设施直依赖（agent/cron/config 等多 crate），chrono-tz 经
  # nemesis-cron 传递；迁移候选（jiff 等）属独立重构任务，非 SC 闸可修。
  # 移除条件：上游恢复维护或 workspace 完成时间库迁移。台账：
  # docs/INFO/2026-08-31_dependency-rules.md（2026-11-18）
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained per upstream announcement (chronotope/chrono#1768); no fix, all versions affected; core time infra used workspace-wide, migration (jiff) is a standalone refactor" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained per upstream announcement (chronotope/chrono#1768); no fix, all versions affected; transitive via nemesis-cron, migration is a standalone refactor" },
]

[licenses]
version = 2
# 宽松许可证白名单。出现新 license 时：先确认兼容性，再决定加白名单还是换依赖。
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "Unlicense",       # 公有领域奉献（OSI approved + FSF Free/Libre）；iroh-relay 链 ws_stream_wasm/pharos/async_io_stream
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # 2026-11-25 清理：移除 allow 中不再出现的 "Unicode-DFS-2016"（unicode-ident
  # 生态已整体迁 Unicode-3.0，在列）与 "OpenSSL"（ring 迁出该许可证后图内零命中）。
  # cargo-deny ≥0.22 对未命中 allow 条目报 license-not-encountered 警告，与
  # advisory 豁免同理：台账须与当前工具语义自洽；若依赖图回引入相应许可证，
  # licenses 段会显式红提示回补。台账：docs/INFO/2026-08-31_dependency-rules.md
  "AGPL-3.0-only",   # 本 workspace 全部自有 crate 的许可证（58 成员）
  "NCSA",            # libfuzzer-sys (MIT OR Apache-2.0) AND NCSA；伊利诺伊大学宽松 BSD 族
]
# 置信度阈值：license 声明解析可信度（默认 0.8，保持）
confidence-threshold = 0.8

[bans]
# 重复版本多 warn 不 deny：生态现实（serde 1.x/0.x 并存等），deny 误伤率过高。
# 多版本是审计信号不是错误——数量突增时人工看。
multiple-versions = "warn"
# wildcard 降 warn（cargo-deny 0.20 的已知行为缺陷：`workspace = true` 继承依赖
# 被 metadata 报成 wildcard，34 个 member 全部误报 deny 不可用）。真正的
# wildcard（version = "*"）在评审 + 本 warn 信号里兜住。
wildcards = "warn"
highlight = "all"
# deny 清单（已知要清除的依赖在此列）：
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
