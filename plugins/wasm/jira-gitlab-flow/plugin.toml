# jira-gitlab-flow 域插件清单（两件套：plugin.toml + guest）。
#
# `wasm-sha256` 由 guest 构建后填入真实哈希（见 README）；根键必须位于任何
# table 段之前——TOML 语义。流程编排全在宿主 flow 引擎（guest 无驻留）；
# 本清单是声明面。
#
# 0.1.2（2026-11-04）：fixloop 步声明执行面 target = "self"（本节点一等
# 执行面，单机形态不需要第二个节点；无回退——删声明才落匹配器阶梯）。
# 0.1.1（2026-11-04）：guest HTTP 2xx 空 body 容忍（Jira transitions POST 恒
# 204、RFC 7230 禁 body——无条件 JSON 解析误报 EOF，报告步假失败的根修）。
# 0.1.0（2026-11-04 jira-gitlab-flow 批）：Jira（Server/DC，PAT Bearer）取
# BUG → GitLab（自托管，REST v4，PRIVATE-TOKEN）仓副本 → 修复 → 发布 MR
# → Jira 回帖转状态，全链自持声明（域知识全在模板 + guest，connector.toml
# 退役形态）。七步剧本：fetch（guest 直连 Jira search）→ sync（宿主
# repo_sync 原语：项目目录 clone-or-pull，凭据同 publish vault 别名）→
# land（落项目）→ fixloop（人工闸唯一一道）→ regress → publish（自动，
# 缺口对账三态）→ report（回帖 + 幂等转状态三步）。两个 base_url 不进
# 剧本缺省（防假缺省 URL）：模板即装即载，未配置时模板 WARN 不注册
# （诚实不发车），面板「实例设置」保存后热生效。
wasm-sha256 = "e5ac10c56cc4eef7b0b7cc83b6f388d59112f833d3ac7bc40042e7bd372fb9bc"
api-version = 1
slug = "jira-gitlab-flow"
kind = "panel"
name = "Jira+GitLab 修复流水线"
version = "0.1.2"
description = "Jira 取 BUG → GitLab 仓副本修复 → MR 发布 → 回帖转状态全链流水线（自持形态：面板 + flow 剧本 + guest 双直连 Jira/GitLab REST；PAT 走 vault）"

# 出网面：只准打两个 base_url 指向的实例（整条目 token，配置热渲染；任一
# 未配置 = 模板不注册，能力整体不发车）；凭据面：双 PAT（vault
# plugin/jira-gitlab-flow/pat = GitLab——名字被宿主 publish 推送凭据推导
# 钉死，repo_sync cred_secret 同源；jira_pat = Jira Bearer——面板表单写入）。
# allow-private：自托管 Jira/GitLab 本就常驻企业内网（10.x/192.168.x），
# 私网放行是产品语义不是测试后门——allowlist 仍钉 base_url 精确值，
# DNS 钉地址（rebinding 防御）照常。
[permissions]
egress = ["{{config.jira_base_url}}", "{{config.gitlab_base_url}}"]
allow-private = true
x-secret = ["pat", "jira_pat"]

[limits]
fuel = 20_000_000
timeout-ms = 10_000

# 实例配置（插件页「配置」钮或面板「实例设置」表单可改；剧本 {{config.<键>}}
# 装载期单遍渲染——模板 args 只引用有缺省的键，即装即载；两个 base_url 无
# 缺省（未设置 = 诚实不发车，不猜 URL）；PAT 走 x-secret，不进这里——凭据
# 面分离。JQL 不做 config 键：单遍渲染不支持跨键引用，project_key 内联在
# JQL 模板里（换靶改 project_key 即换 JQL）。
[config-schema]
jira_base_url = { desc = "Jira REST 基址（如 https://jira.example.com；未设置时模板不注册）" }
jira_project_key = { desc = "Jira 项目键（PROJ-123 的 PROJ 段）", default = "PROJ" }
jira_transition_name = { desc = "report 步目标状态（Jira transition name 或目标态名，不分大小写）", default = "Done" }
gitlab_base_url = { desc = "GitLab 基址（如 https://gitlab.example.com；未设置时模板不注册）" }
gitlab_owner = { desc = "GitLab 仓库属主（group/namespace；兼任 git 推送凭据用户名——GitLab HTTPS+PAT 任意非空用户名均可）", default = "group" }
gitlab_repo = { desc = "GitLab 仓库名", default = "project" }
gitlab_target_branch = { desc = "MR 目标分支", default = "main" }
board_project = { desc = "看板项目名（须已注册且带 directory——repo_sync 目录真相源）", default = "jira-gitlab" }

# 页面骨架：宿主预置组件按声明渲染（词汇 form/table/timeline/detail/actions）。
# 数据绑定 flow://<template>/<view> = 宿主 flow 引擎代答；cmd://<name> = guest。
[[ui.page]]
route = "jira-gitlab-flow"
title = "Jira+GitLab 修复流水线"
icon = "ticket"

[[ui.page.views]]
kind = "table"
bind = "flow://jira-gitlab-pipeline/list"

[[ui.page.views.columns]]
key = "instance"
label = "实例"

[[ui.page.views.columns]]
key = "title"
label = "标题"

[[ui.page.views.columns]]
key = "state"
label = "状态"

[[ui.page.views.columns]]
key = "step"
label = "当前步"

[[ui.page.views.columns]]
key = "board_issue"
label = "看板单"

[[ui.page.views]]
kind = "timeline"
bind = "flow://jira-gitlab-pipeline/timeline"

[[ui.page.views]]
kind = "detail"
bind = "flow://jira-gitlab-pipeline/detail"

[[ui.page.views.columns]]
key = "instance"
label = "实例"

[[ui.page.views.columns]]
key = "state"
label = "状态"

[[ui.page.views.columns]]
key = "current_step"
label = "当前步"

[[ui.page.views.columns]]
key = "board_issue"
label = "看板单"

[[ui.page.views.columns]]
key = "parked"
label = "停车"

# 人工闸确认表单：instance 留空 = 最近更新的实例（fixloop 停 awaiting-gate）。
[[ui.page.views]]
kind = "form"
bind = "flow://jira-gitlab-pipeline/confirm"

[[ui.page.views.fields]]
key = "instance"
label = "实例（留空 = 最近更新）"
placeholder = "如 12"

# 停车实例恢复表单。
[[ui.page.views]]
kind = "form"
bind = "flow://jira-gitlab-pipeline/resume"

[[ui.page.views.fields]]
key = "instance"
label = "实例（留空 = 最近更新）"
placeholder = "如 12"

# guest 动作：单条详情投影（Jira issue key 字符串，PROJ-123 形态）。
[[ui.page.views]]
kind = "form"
bind = "cmd://jira_get"

[[ui.page.views.fields]]
key = "key"
label = "Issue 键"
placeholder = "如 PROJ-123"

# 实例设置（自持写通道）：字段全可留空 = 保持原值；双 PAT 只写不读（保存后
# 无法回显）。单条配置微调也可走插件页「配置」钮（同一实例配置面）。
[[ui.page.views]]
kind = "form"
bind = "cmd://save_settings"

[[ui.page.views.fields]]
key = "jira_base_url"
label = "Jira 基址"
placeholder = "如 https://jira.example.com"

[[ui.page.views.fields]]
key = "jira_project_key"
label = "Jira 项目键"
placeholder = "PROJ"

[[ui.page.views.fields]]
