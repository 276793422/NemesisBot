command = "flow://jira-gitlab-pipeline/resume"

# 剧本：取 → 同步仓副本 → 落项目 → 修复循环（人工闸唯一一道）→ 验收 →
# 发布 MR（自动不停，缺口对账三态）→ Jira 回帖转状态。域知识声明面：
# origin 三件套（建单坐标）+ on-transition（状态回写）+ publish 协议 +
# repo_sync（仓副本同步），全部模板声明 + guest 自报步骤；宿主只提供通用
# 原语与 token 插值。
[[flow.template]]
id = "jira-gitlab-pipeline"
interval-secs = 600
origin-type = "jira"
# 字面 `jira` 前缀（plugin fetch 模板禁 {{connector}}/{{arg.*}}）——渲染
# 产物 `jira/<project_key>/<key>` 三段形态；parse-origin-id 按 '/' 分段
# （0 起：0=jira、1=project_key、2=issue key）。
origin-id = "jira/{{config.jira_project_key}}/{{key}}"
# 回写坐标落库载体：project_key 取实例配置（{{config.*}} 装载期渲染），
# issue_key 取条目键（{{key}} = key_field 指定的字段值，即 Jira issue key
# 字符串）；board 单 origin_meta 由此透传落库。origin-meta 值域 = 身份
# token 表 {key, config.*}。
origin-meta = { project_key = "{{config.jira_project_key}}", issue_key = "{{key}}" }

# board 状态转移 → Jira issue 回帖（guest 自报 comment op）。origin_meta
# 优先；v1 旧单 origin_meta 缺席时 parse-origin-id 现场分解 origin_id
# （`jira/<project_key>/<key>` 形态）。
[flow.template.on-transition]
op = "plugin:jira-gitlab-flow:comment"
args = { key = "{{origin_meta.issue_key}}", body = "{{transition.text}}" }
parse-origin-id = { issue_key = "segment '/' 2" }

# 取数 = guest 自报 fetch op（http-send 直连 Jira search）。jql 内联
# project_key（单遍渲染不支持跨键引用，换靶改配置不改清单）；key/title/
# body 三字段是宿主物化坐标（`$.` JSON path，Jira search 包裹对象：key
# 顶层、正文藏 fields 下——body_field 落实时提取 [CHECK] 行为验收锚）。
[[flow.template.steps]]
id = "fetch"
kind = "plugin:jira-gitlab-flow:fetch"
args = { jql = "project = {{config.jira_project_key}} AND status not in (Done, Closed) ORDER BY created DESC", max_results = "50", key_field = "$.key", title_field = "$.fields.summary", body_field = "$.fields.description" }

# 仓副本同步（宿主 repo_sync 原语）：项目目录 = 注册表 directory 唯一真相
# 源（不自动注册——先建项目再发车）；URL 装载期渲染；凭据别名与 publish
# 推送同源（vault plugin/jira-gitlab-flow/pat，GitLab HTTPS+PAT 任意非空
# 用户名，cred_user 缺省 oauth2）。clone/pull 失败 = 没法修复，停车。
[[flow.template.steps]]
id = "sync"
kind = "repo_sync"
on-fail = "park_human"
args = { project = "{{config.board_project}}", url = "{{config.gitlab_base_url}}/{{config.gitlab_owner}}/{{config.gitlab_repo}}.git", cred_secret = "plugin/jira-gitlab-flow/pat" }

# 落项目（任务副本项目绑定；fixloop 经项目 loop 在该目录内执行）。
[[flow.template.steps]]
id = "land"
kind = "board_land"
args = { project = "{{config.board_project}}" }

[[flow.template.steps]]
id = "fixloop"
kind = "agent_fixloop"
gate = "manual"
on-fail = "park_human"
# 执行面显式声明（一等选择，无回退）：target = "self" = 本节点执行——
# 单机形态，不需要第二个节点；本机回环执行面照常走完整派发/基线/评审
# 链。删掉此行 = 既有匹配器/兜底阶梯（多节点形态按职能选人）。
args = { target = "self" }

[[flow.template.steps]]
id = "regress"
kind = "check_regress"

# 发布步（声明化）：推交付分支 nemesis/task-<task_id> + 建 MR + 缺口对账
# （Found/Absent/Inconclusive 三态）。双 op 均 plugin 引用，凭据别名 =
# plugin/jira-gitlab-flow/pat 按 create_op 路由推导（git 推送仍在宿主
# git_repo 侧）；owner/repo 来自 {{config.*}}（装载期渲染成字面量，owner
# 兼任 git 推送凭据用户名）；create_args/reconcile_args 是 JSON 对象串
# （值过 token 渲染：branch/commit/base_sha/task_id 运行期，title/
# board_issue 等取数期；reconcile 翻页由宿主注入 limit/page 数字基参，
# guest 双形态透传远端）。人工闸不设（publish 自动不停——与 fixloop 闸
# 分工：修复内容人审，发布动作自动）。对账匹配 `$.source_branch`（GitLab
# MR JSON 顶层字段）；抽取 `$.iid`/`$.web_url`（宿主 parse_publish_result
# 直读）。
# on-fail=continue：发布失败=缺口记账（不停车），report 照常出报告——
# dossier/timeline 携带缺口，Jira 评论区仍拿到报告路径可查证；fixloop 的
# park_human 语义保持不变（无交付=没法继续，必须停车）。
[[flow.template.steps]]
id = "publish"
kind = "publish"
on-fail = "continue"
args = { owner = "{{config.gitlab_owner}}", repo = "{{config.gitlab_repo}}", create_op = "plugin:jira-gitlab-flow:create_mr", create_args = '{"owner": "{{config.gitlab_owner}}", "repo": "{{config.gitlab_repo}}", "source_branch": "{{branch}}", "target_branch": "{{config.gitlab_target_branch}}", "title": "[{{board_issue}}] {{title}}", "description": "看板单 {{board_issue}}；交付分支 `{{branch}}`（commit {{commit}}，基线 {{base_sha}}）。\n\n来源 issue {{ext_key}}；由 jira-gitlab-flow 流水线自动发布。"}', result_ref = "$.iid", result_url = "$.web_url", reconcile_op = "plugin:jira-gitlab-flow:mr_list", reconcile_args = '{"owner": "{{config.gitlab_owner}}", "repo": "{{config.gitlab_repo}}", "state": "all"}', reconcile_match = "$.source_branch == {{branch}}" }

# 报告回帖 + 幂等转状态（guest 自报 report op：同文去重回帖 → transition
# name/to.name 不分大小写匹配转 jira_transition_name 目标状态；转失败=
# failed 注明「回帖已发出」——下一步 on-fail=continue 缺口记账不停车）。
# args_json 含 report_path token 渲染。
[[flow.template.steps]]
id = "report"
kind = "report"
args = { connector = "plugin:jira-gitlab-flow:report", args_json = '{"key": "{{ext_key}}", "body": "NemesisBot 流水线完成「{{title}}」（看板单 {{board_issue}}）\n\n报告：{{report_path}}"}' }
