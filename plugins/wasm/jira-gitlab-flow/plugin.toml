label = "完成态 transition 名"
placeholder = "Done"

[[ui.page.views.fields]]
key = "gitlab_base_url"
label = "GitLab 基址"
placeholder = "如 https://gitlab.example.com"

[[ui.page.views.fields]]
key = "gitlab_owner"
label = "仓库属主（group/namespace）"
placeholder = "如 mygroup"

[[ui.page.views.fields]]
key = "gitlab_repo"
label = "仓库名"
placeholder = "如 myrepo"

[[ui.page.views.fields]]
