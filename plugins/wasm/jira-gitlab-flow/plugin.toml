[[ui.page.views.fields]]
key = "pat"
label = "GitLab 访问令牌（PAT）"
field-type = "secret"
placeholder = "留空 = 保持已存令牌"

[[ui.page.views]]
kind = "actions"
bind = ""

[[ui.page.views.buttons]]
