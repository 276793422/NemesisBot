# 剧本：取 → 同步仓副本 → 落项目 → 修复循环（人工闸唯一一道）→ 验收 →
# 发布（自动不停，缺口对账三态）→ Jira 回帖上报。域知识声明面：origin
# 三件套 + on-transition + publish 协议 + repo_sync + guest 自报步骤；
# 宿主只提供通用原语与 token 插值。
[[flow.template]]
id = "sc-bugfix-pipeline"
interval-secs = 600
origin-type = "jira"
# 字面 `jira` 前缀（plugin fetch 模板禁 {{connector}}/{{arg.*}}）——渲染
# 产物 `jira/<project_key>/<key>` 三段形态；parse-origin-id 按 '/' 分段
# （0 起：0=jira、1=project_key、2=issue key）。
origin-id = "jira/{{config.jira_project_key}}/{{key}}"
# 回写坐标落库载体：project_key 取实例配置（{{config.*}} 装载期渲染），
# issue_key 取条目键（{{key}} = key_field 指定的字段值，即 Jira issue key
# 字符串）；board 单 origin_meta 由此透传落库。origin-meta 值域 = 身份
# token 表 {key, config.*}。
origin-meta = { project_key = "{{config.jira_project_key}}", issue_key = "{{key}}" }

# board 状态转移 → Jira issue 回帖（guest 自报 comment op，双认证形态在
# guest 侧按 jira_auth_mode 现取现用）。origin_meta 优先；v1 旧单
# origin_meta 缺席时 parse-origin-id 现场分解 origin_id。
[flow.template.on-transition]
op = "plugin:sc-bugfix:comment"
args = { key = "{{origin_meta.issue_key}}", body = "{{transition.text}}" }
parse-origin-id = { issue_key = "segment '/' 2" }

# 取数 = guest 自报 fetch op（http-send 直连 Jira search）。jql 内联
# project_key；key/title/body 三字段是宿主物化坐标（`$.` JSON path，
# Jira search 包裹对象：key 顶层、正文藏 fields 下——body_field 落实时
# 提取 [CHECK] 行为验收锚）。
[[flow.template.steps]]
id = "fetch"
kind = "plugin:sc-bugfix:fetch"
args = { jql = "project = {{config.jira_project_key}} AND status not in (Done, Closed) ORDER BY created DESC", max_results = "50", key_field = "$.key", title_field = "$.fields.summary", body_field = "$.fields.description" }

# 仓副本同步（宿主 repo_sync 原语）。GitLab 凭据 = pat（HTTPS+PAT 任意
# 非空用户名，cred_user 取 owner）。clone/pull 失败 = 没法修复，停车。
[[flow.template.steps]]
id = "sync-gitlab"
kind = "repo_sync"
when = "{{config.code_host}} == gitlab"
on-fail = "park_human"
args = { project = "{{config.board_project}}", url = "{{config.gitlab_base_url}}/{{config.gitlab_owner}}/{{config.gitlab_repo}}.git", cred_secret = "plugin/sc-bugfix/pat", cred_user = "{{config.gitlab_owner}}", proxy = "{{config.proxy}}" }

# 落项目（任务副本项目绑定；fixloop 经项目 loop 在该目录内执行）。
# body_preamble = 六阶段修复契约确定性注入 issue description 头部（宿主
# board_land 原语；worker 读单即读纪律，不靠提示词软约束）——①理解→②分析
# →③开发→④测试→⑤验证→⑥上报，每阶段证据标记留痕，缺失=验收不放行。
[[flow.template.steps]]
id = "land"
kind = "board_land"
args = { project = "{{config.board_project}}", body_preamble = "【修复流程契约】按六阶段推进，每阶段完成在回复中以证据标记留痕：\n① 理解：复述 BUG 现象、复现路径与影响范围 [UNDERSTOOD]\n② 分析：定位根因到具体文件与代码路径，给出证据 [ROOTCAUSE]\n③ 开发：最小改动修复根因，不夹带无关重构\n④ 测试：运行或补充能证明修复生效的测试\n⑤ 验证：全量门禁与既有回归，命令与输出原文贴出\n⑥ 上报：交付评论汇总各阶段证据与标记\n任一阶段证据标记缺失 = 验收不放行。" }

[[flow.template.steps]]
id = "fixloop"
kind = "agent_fixloop"
gate = "manual"
on-fail = "park_human"
# 执行面显式声明（一等选择，无回退）：target = "self" = 本节点执行——
# 单机形态，不需要第二个节点；本机回环执行面照常走完整派发/基线/评审
# 链。删掉此行 = 既有匹配器/兜底阶梯（多节点形态按职能选人）。
args = { target = "self" }

[[flow.template.steps]]
id = "regress"
kind = "check_regress"

# 发布步（声明化）：推交付分支 nemesis/task-<task_id> + 建 MR + 缺口对账
# 三态；凭据别名显式钉 plugin/sc-bugfix/pat（= 推送推导同名，repo_sync
# 同源）。on-fail=continue：发布失败=缺口记账（不停车），report 照常出
# 报告——dossier/timeline 携带缺口。
[[flow.template.steps]]
id = "publish-gitlab"
kind = "publish"
when = "{{config.code_host}} == gitlab"
on-fail = "continue"
args = { owner = "{{config.gitlab_owner}}", repo = "{{config.gitlab_repo}}", cred_secret = "plugin/sc-bugfix/pat", proxy = "{{config.proxy}}", create_op = "plugin:sc-bugfix:create_mr", create_args = '{"owner": "{{config.gitlab_owner}}", "repo": "{{config.gitlab_repo}}", "source_branch": "{{branch}}", "target_branch": "{{config.gitlab_target_branch}}", "title": "[{{board_issue}}] {{title}}", "description": "看板单 {{board_issue}}；交付分支 `{{branch}}`（commit {{commit}}，基线 {{base_sha}}）。\n\n来源 issue {{ext_key}}；由 sc-bugfix 流水线自动发布。"}', result_ref = "$.iid", result_url = "$.web_url", reconcile_op = "plugin:sc-bugfix:mr_list", reconcile_args = '{"owner": "{{config.gitlab_owner}}", "repo": "{{config.gitlab_repo}}", "state": "all"}', reconcile_match = "$.source_branch == {{branch}}" }

# 报告回帖 + 幂等转状态（guest 自报 report op：jira_transition_name 留空 =
# 只回帖不转状态；非空时同文去重回帖 → transition name/to.name 不分大小写
# 匹配转状态，转失败=failed 注明「回帖已发出」——on-fail 缺省记账不停车）。
[[flow.template.steps]]
id = "report"
kind = "report"
args = { connector = "plugin:sc-bugfix:report", args_json = '{"key": "{{ext_key}}", "body": "NemesisBot 流水线完成「{{title}}」（看板单 {{board_issue}}）\n\n报告：{{report_path}}"}' }
