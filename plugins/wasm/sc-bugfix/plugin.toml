# sc-bugfix 插件清单（两件套：plugin.toml + guest）。
#
# `wasm-sha256` 由 guest 构建后填入真实哈希（见 README）；根键必须位于任何
# table 段之前——TOML 语义。流程编排全在宿主 flow 引擎（guest 无驻留）；
# 本清单是声明面。
#
# 0.1.0（2026-11-04 sc-bugfix 批）：Jira（Server/DC）取 BUG → GitLab 仓
# 副本 → 修复 → GitLab MR 发布 → Jira 回帖上报，全链自持声明。发布线
# 单源 GitLab（PR 模型）；凭据/坐标随源声明。
#
# Jira 双认证形态（jira_auth_mode）：`pat`（缺省，Bearer 令牌 jira_pat
# secret）| `basic`（账号密码——jira_username 配置 + jira_password secret，
# HTTP Basic base64(user:pass)）。jira_transition_name 缺省空 = report
# 只回帖不转状态（诚实跳过）；需要自动转状态时填 transition 名。
wasm-sha256 = "bec606668b4b0cc823501b124df44b1928dc297674a8749abc8d0e34fd0353d8"
api-version = 1
slug = "sc-bugfix"
kind = "panel"
name = "SC BUG 修复流水线"
version = "0.1.0"
description = "Jira 取 BUG → GitLab 仓副本修复 → MR 发布 → Jira 回帖上报全链流水线（自持形态：面板 + flow 剧本 + guest 直连 Jira/GitLab REST；凭据走 vault）"

# 出网面：base_url 整条目 token（配置热渲染；未配置 = 条目丢弃，
# 全部未配置 = 能力整体关闭——deny-by-default 不破）；allow-private：
# 自托管 Jira/GitLab 本就常驻企业内网，私网放行是产品语义不是
# 测试后门——allowlist 仍钉 base_url 精确值，DNS 钉地址照常。凭据面：
# pat（GitLab PAT，宿主 publish 推送凭据推导同名钉死）/ jira_pat（Bearer）/
# jira_password（Basic），全走 vault（面板表单只写不读）。
[permissions]
egress = ["{{config.jira_base_url}}", "{{config.gitlab_base_url}}"]
allow-private = true
x-secret = ["pat", "jira_pat", "jira_password"]

[limits]
fuel = 20_000_000
timeout-ms = 10_000

# 实例配置（插件页「配置」钮或面板「实例设置」表单可改；{{config.<键>}}
# 装载期单遍渲染，已声明未配置 = 空串——proxy 这类可选键靠它
# 免于整模板拒绝）。凭据走 x-secret 不进这里。
# JQL 不做 config 键：project_key 内联在 JQL 模板里（换靶改 project_key）。
[config-schema]
code_host = { desc = "代码托管源（gitlab）", default = "gitlab" }
jira_base_url = { desc = "Jira REST 基址（如 https://jira.example.com）" }
jira_project_key = { desc = "Jira 项目键（PROJ-123 的 PROJ 段）", default = "PROJ" }
jira_auth_mode = { desc = "Jira 认证形态（pat = Bearer 令牌 | basic = 账号密码）", default = "pat" }
jira_username = { desc = "Jira 账号（仅 jira_auth_mode=basic 需要）" }
jira_transition_name = { desc = "report 步目标状态（transition name，不分大小写）；留空 = 只回帖不转状态" }
gitlab_base_url = { desc = "GitLab 基址（必填，如 https://gitlab.example.com）" }
gitlab_owner = { desc = "GitLab 仓库属主（group/namespace；兼任 git 推送凭据用户名——GitLab HTTPS+PAT 任意非空用户名均可）", default = "group" }
gitlab_repo = { desc = "GitLab 仓库名", default = "project" }
gitlab_target_branch = { desc = "MR 目标分支", default = "main" }
board_project = { desc = "看板项目名（须已注册且带 directory——repo_sync 目录真相源）", default = "sc-bugfix" }
proxy = { desc = "出站代理 URL（http:// 或 socks5h://；留空 = 直连；作用于 guest HTTP 与 git 推送/同步）" }

# 页面骨架：宿主预置组件按声明渲染（词汇 form/table/timeline/detail/actions）。
# 数据绑定 flow://<template>/<view> = 宿主 flow 引擎代答；cmd://<name> = guest。
[[ui.page]]
