kind = "form"
bind = "flow://sc-bugfix-pipeline/resume"

[[ui.page.views.fields]]
key = "instance"
label = "实例（留空 = 最近更新）"
placeholder = "如 12"

# guest 动作：单条详情投影（Jira issue key 字符串，PROJ-123 形态）。
[[ui.page.views]]
kind = "form"
bind = "cmd://jira_get"

[[ui.page.views.fields]]
key = "key"
label = "Issue 键"
placeholder = "如 PROJ-123"

