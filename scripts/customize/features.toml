category = "subsystems"
default = true

[[feature]]
id = "voice"
label = "语音管线"
desc = "本地 STT/TTS/VAD + 云转写（`nemesisbot voice` 命令 + Web 语音端点）。文件/缓冲区驱动，不含设备 IO"
category = "subsystems"
default = true

# NOTE: `voice-capture` 从 voice 拆出的设备 IO 面（麦克风采集/扬声器播放/回声消除
# /loopback，cpal+wasapi 依赖随它进出）。TTS 落文件、文件转写、VAD 缓冲不依赖它；
# 关闭后设备枚举/实时对话/AEC 路径在运行期诚实报「未编译」。依赖 voice（自动带入）。
[[feature]]
id = "voice-capture"
label = "语音设备 IO（采集/播放/AEC）"
desc = "麦克风采集 + 扬声器播放 + 回声消除（实时对话/设备枚举）。纯转写/IoT 无音频硬件建议关"
category = "subsystems"
default = true

# NOTE: `cluster` 现已可裁剪（feature 穿透 nemesisbot → nemesis-web/cluster）。
# 关闭后 nemesis-cluster 整包不参与编译；集群 Dashboard 的 WSAPI 命令与 `cluster_rpc`
# 工具随之不可用。默认开启（=完整构建行为不变）。

[[feature]]
id = "cluster"
label = "集群（RPC/发现/续行）"
desc = "P2P 集群编排（`nemesisbot cluster` + 集群 Dashboard + cluster_rpc 工具）。单机/IoT 建议关闭"
category = "subsystems"
default = true

# NOTE: `cluster-roaming`（A1 iroh 跨网 P2P 叠加层）默认开（2026-10-22）——
# UDP 打洞是跨网组网的基础能力，dashboard 中继页开箱可用。iroh QUIC 依赖随
# nemesis-cluster/cluster-roaming 进出；`cluster roaming` CLI 子命令同 feature
# 门控。依赖 cluster（自动带入）。IoT 最小形态经预设显式裁掉。
[[feature]]
id = "cluster-roaming"
label = "集群跨网 P2P（iroh QUIC）"
desc = "iroh 跨网 P2P 叠加层（`cluster roaming` 子命令 + 自证端点/中继打洞）。默认开：跨网组网基础能力；IoT 最小形态可裁"
category = "subsystems"
default = true

# NOTE: `roaming-relay`（QUIC 中继服务器）默认开（2026-10-22，与 cluster-roaming
# 同批翻转）——自建中继回落是「客户端指向中继服务器 + 令牌配对」流程的另一半，
# 不编译则 dashboard 中继页恒为降级面板。iroh-relay server 面拉入 rcgen/ACME
# 等编译增量，由全量构建承担。依赖 cluster-roaming（自动带入）。
# 独立命令 `quic relay` 与随 gateway 启动同 feature 门控。
[[feature]]
id = "roaming-relay"
label = "QUIC 中继服务器（内网穿透）"
desc = "自建 iroh 中继回落服务器（`quic relay` 独立命令 + 随 gateway 启动）。默认开：客户端配对流程的另一半；IoT 最小形态可裁"
category = "subsystems"
default = true

# NOTE: `forge` 可裁剪（feature 穿透 nemesisbot → nemesis-agent/forge + nemesis-web/forge）。
# 这是 Class C 内核裁剪——动 nemesis-agent 内核。关闭后自学习整包不编译。
[[feature]]
id = "forge"
label = "自学习（Forge）"
desc = "Read→Execute→Reflect→Write 自学习框架（`nemesisbot forge` + forge 工具）。默认 config 关闭但模块仍编译；裁掉后整包不编译"
category = "subsystems"
default = true

# NOTE: `memory` 可裁剪（feature 穿透 nemesisbot → nemesis-agent/memory + nemesis-web/memory）。
# Class C 内核裁剪。对话记忆（agent 内部 ConversationMemory）独立于本 crate，裁掉不会失忆；
# 关闭后强化记忆/向量存储/ONNX 嵌入整包不编译，memory_search/store/forget/list 工具、
# `nemesisbot memory` 命令、Memory Dashboard 随之不可用。
# F6 注记（2026-10-18 二轮复评）：memory 建议与 security 同开——memory_store/forget
# 审批闸（GatewayMemoryGate）的门是 memory+security，memory-without-security 组合
# 无审批闸（写入放行不弹卡）。不建强制依赖，组合仍可编译。
[[feature]]
id = "memory"
label = "强化记忆（向量存储）"
desc = "增强记忆/向量存储/ONNX 嵌入（`nemesisbot memory` + memory 工具 + Memory Dashboard）。对话记忆独立，裁掉不会失忆；裁后整包不编译"
category = "subsystems"
default = true

# NOTE: `workflow` 可裁剪（feature 穿透 nemesisbot → nemesis-agent/workflow + nemesis-web/workflow）。
# Class C 内核裁剪。关闭后 DAG 工作流引擎整包不编译；workflow_run 工具、`nemesisbot workflow` 命令、
# Workflow Dashboard、/workflow/chat 独立聊天页、message/event 触发器随之不可用。
[[feature]]
id = "workflow"
label = "DAG 工作流"
desc = "DAG 工作流引擎（`nemesisbot workflow` + workflow_run 工具 + Workflow Dashboard + /workflow/chat + 触发器）。IoT/无工作流场景建议关闭；裁后整包不编译"
category = "subsystems"
default = true

# NOTE: `security` 可裁剪（feature 穿透 nemesisbot → nemesis-agent/security + nemesis-web/security + nemesis-security/security + nemesis-skills/security）。
# Class C 内核裁剪。关闭后整个安全中间件（8 层 pipeline：注入/命令/ABAC/凭据/DLP/SSRF/病毒扫描/审计链）
# + 审批 + guardian LLM judge + skill 签名（signer）整包不编译，**nemesis-security crate 完全排除**（cargo tree = 0）。
# **警告**：裁掉后 Bot 无安全防护（无工具调用拦截、无审批、无审计链）——仅适合可信隔离环境/IoT。
[[feature]]
id = "security"
label = "安全中间件"
desc = "8 层安全 pipeline + ABAC + 审批弹窗 + guardian LLM judge + skill 签名（`nemesisbot security` + Security Dashboard）。裁后无安全防护且 nemesis-security 整包不编译，仅适合可信/IoT"
category = "subsystems"
default = true

# NOTE: `scanner` 已从 security 拆出（2026-09-28）：病毒扫描 = 第 7 层（ClamAV + zip 依赖）。
# implies security（第 7 层执行臂在 pipeline 内）。关闭后第 7 层诚实短路（构造时 WARN 注记，
# 非静默），第 8 层审计链照常；`nemesisbot scanner` CLI + Scanner Dashboard 页随之消失。
[[feature]]
id = "scanner"
label = "病毒扫描（ClamAV）"
desc = "病毒扫描引擎（第 7 层，`nemesisbot scanner` + Scanner Dashboard + ClamAV 集成）。IoT/无文件扫描需求建议关；关后第 7 层诚实短路、其余 7 层安全照常"
category = "subsystems"
default = true

# NOTE: `sandbox` 可裁剪（Sandboxie 集成 = Windows 内核驱动；IoT/Linux 不用）。
# 关闭后 nemesis-sandbox 整包不编译，`nemesisbot sandbox` 命令、executor.sandbox=true（Layer 2）不可用。
# Layer 1 执行分离（executor.enabled，进程隔离）独立保留；7z/Sandboxie 运行时下载（sandbox install）。
[[feature]]
id = "sandbox"
label = "沙盒（Sandboxie 集成）"
desc = "Sandboxie 沙盒（executor.sandbox=true + nemesisbot sandbox 装/卸/提交）。Windows 内核驱动，IoT/Linux 不用建议关"
category = "subsystems"
default = true

# NOTE: `vm`（P5 桌面级 VM 第三类隔离后端）依赖 sandbox（nemesis-sandbox/vm
# 模块住同一 crate），关 sandbox 连带裁 VM。QEMU 起整机、独立内核级隔离，
# 需要 KVM/WHPX 硬件加速 + base 镜像磁盘预算——IoT/低资源建议关。
[[feature]]
id = "vm"
label = "VM 后端（桌面级虚拟机）"
desc = "QEMU 整机隔离执行后端（executor.vm，独立内核级隔离；需 KVM/WHPX + 磁盘预算）。IoT/无虚拟化环境建议关"
category = "subsystems"
default = true

# NOTE: `vm-display`（P5-R2 带界面 VM 显示通道）依赖 vm（display_port_query
# 数据源是 VmSupervisor，无 VM 后端的显示插件无意义）。三线体积纪律：
# plugin-vm cdylib 独立非 workspace member、noVNC 前端动态 import（不进主
# bundle）、网关 shim feature 门控——关 = /ws/vm-display 不编译、Dashboard
# 「查看屏幕」入口 tree-shake 掉，主二进制零增量。
[[feature]]
id = "vm-display"
label = "VM 显示通道（VNC）"
desc = "带界面 VM 屏幕查看（executor.vm.display=vnc + plugin-vm 插件 + Dashboard 屏幕 modal）。依赖 vm；关 = /ws/vm-display 不编译、显示入口消失"
category = "subsystems"
depends = ["vm"]
default = true

# NOTE: `eval` 依赖 sandbox+security（复合 feature），提供 `nemesisbot eval`
# prompt/skill 安全行为评估（沙盒真跑 + 四记录点 + LLM 代理脱敏）。
[[feature]]
id = "eval"
label = "行为评估（eval 命令）"
desc = "prompt/skill 沙盒内行为评估（`nemesisbot eval`，仅数据采集不下结论）。依赖 sandbox+security+EP 注入器+LLM 代理。IoT/Linux 建议关"
category = "subsystems"
default = true

# NOTE: `board` 可裁剪（W2 P1 managed-agent 看板）。feature = 注入 +
# nemesis-web/board 管理面双开——nemesis-board 是 web 的 optional 依赖，
# 关 = `nemesisbot issue` CLI、board.* WSAPI、team.*、看板资产端点与
# nemesis-board 整包退出依赖图（内嵌 rusqlite bundled 随之消失——iotsmall
# 里最后一个 SQLite 来源）。前端看板页由 VITE_FEATURE_BOARD 单独门控。
[[feature]]
id = "board"
label = "托管 Agent 看板"
desc = "manager 看板（issue/项目/评论/指派，`nemesisbot issue` + Dashboard 看板页）。单机/无任务编排场景建议关；关后整包退出依赖图（内嵌 SQLite 随它进出）"
category = "subsystems"
default = true

# NOTE: `connectors`（行动代理 P0 数据面，2026-10-14）。connector_find/invoke
# 工具 + `nemesisbot connector` CLI + connectors.*/paperbroker.* WSAPI。
# **nemesis-security 被本 crate 无条件依赖**（Ed25519 签名/信任库复用）——
# 关 = connectors 与 security 整包一并退出依赖图（iotsmall 白编译清零：
# security=false 时 8 层管线本就不接线，crate 本体此前却恒在场）。
[[feature]]
id = "connectors"
label = "行动代理连接器"
desc = "connector_find/invoke 工具 + `nemesisbot connector` CLI + connectors.*/paperbroker.* WSAPI（只读数据面）。关后 connectors 与 security 整包一并退出依赖图（无安全管线场景省密码学栈）。IoT/单机建议关"
category = "subsystems"
default = true

# NOTE: `terminal` 可裁剪（L8 PTY 内嵌终端，feature 穿透 nemesisbot → nemesis-web/terminal）。
# 双闸之二（编译闸）；config terminal.enabled（默认 false）是运行闸。交互 shell
# 无法逐命令审批——信任级=dashboard 登录用户，全 I/O 审计 <workspace>/logs/terminal/。
# 关闭后 /ws/pty 端点 + portable-pty 依赖 + TerminalView 从前后端同时消失。
[[feature]]
id = "terminal"
label = "PTY 内嵌终端"
desc = "Dashboard 交互终端（/ws/pty + xterm.js，config terminal.enabled 默认关）。交互 shell 信任级高，IoT/无头建议关；裁后端点+页面 tree-shake 掉"
category = "subsystems"
default = true

# NOTE: `codemode`（T2，L1 脚本工具层）——code_run 工具（rquickjs QuickJS 引擎
# 随它进出；关 = 工具不注册，引擎不参与编译）。运行开关是 config
# agents.codemode.enabled（默认关）：编译裁剪 + 运行双闸，同 hidden_tools 模型。
# **Android 构建恒无此模块**（rquickjs-sys 无 android bindings，依赖 target
# 门控排除——勾不勾都一样），其余平台随本开关。
[[feature]]
id = "codemode"
label = "code_run 脚本工具"
desc = "脚本化批量工具编排（QuickJS 沙箱：资源限制 + 工具调用过安全 8 层，config agents.codemode.enabled 默认关）。IoT/极小镜像建议关；Android 构建恒无（引擎无 android bindings）"
category = "subsystems"
default = true

# NOTE: `verify-enforce-lock` 是**锁定版旗标**（签名验证接入计划 §2.1）——空
# feature，纯编译期 cfg：勾上即把 enforce 策略烧死（config.security.json 的
# signature_verify 任意值被忽略，启动自验失败 exit 86；无编译期锚直接拒启）。
# 默认关（消费版三态开关跟随 config）；勾选 + certs/root_cert.der 在仓库 =
# 锁定版本地可直接构建。CI 锁定包（nightly-locked-full.zip）即此 feature 构建。
[[feature]]
id = "verify-enforce-lock"
label = "锁定版（签名验证强制）"
desc = "编译期烧死 enforce：启动自验失败即拒启（exit 86），config 不可关（MDM 管控语义）。需先完成密钥仪式（scripts/init-signing.sh）让 certs/root_cert.der 入仓，否则构建出的锁定版无法启动。消费版保持关"
category = "subsystems"
default = false

# NOTE: `plugins-wasm` 可裁剪（WASM 组件插件框架，2026-09-29）。2026-10-21 起
# wasmtime 运行时整体剥离进宿主壳 DLL plugins/plugin-wasm（独立构建，产物
# plugin_wasm.dll ~20MB 放 exe 旁 plugins/；装载缺席 = 子系统诚实关闭）——exe
# 本体体积不再含 wasmtime（实测主二进制 -22.8MB），上述 +9.35MB iotsmall 实测
# 已成历史口径。panic=abort 相容性已实证（2026-10-17 四路径探针
# trap/mem_bomb/fuel_bomb/echo 全接住；复跑：crates/nemesis-plugins-wasm
# /examples/iotsmall_abort_probe.rs，注意该探针测的 exe 侧引擎已随剥离退役，
# 兼容性结论由壳侧同代 wasmtime 延续）。关闭后 nemesis-plugins-wasm /
# nemesis-plugin-sdk 整包不编译，plugin.<slug> 工具、plugins.wasm.* WSAPI、
# `nemesisbot plugin` CLI、Dashboard 插件页 WASM 分节随之消失（诚实报未编译）。
[[feature]]
id = "plugins-wasm"
label = "WASM 组件插件（沙盒化）"
desc = "wasmtime 组件插件（plugin.<slug> 工具/观察者，fuel/内存/墙钟三重限制 + egress deny-by-default，`nemesisbot plugin` + Dashboard 插件页 WASM 分节）。IoT/低资源建议关；裁后整包不编译"
category = "subsystems"
default = true

# NOTE: `selfupdate`（L9 版本自切换通道，`nemesisbot selfupdate
# check/apply/status` CLI + gateway 九步 apply 编排）。implies security
# （审批 manager + 审计链是九步的两步）。关闭后自切换通道整体消失。
[[feature]]
id = "selfupdate"
label = "版本自切换（selfupdate）"
desc = "版本自更新通道（`nemesisbot selfupdate` + gateway apply 编排，v4 验签 + zip 解包 + 审批 + 审计链）。IoT/受控环境建议关"
category = "subsystems"
default = true

# NOTE: 八个「构建体积细粒度」feature（2026-10-17 重新评估，全默认开 =
# 全量构建不变）：pricing-embed（内嵌价目表）/ verify（启动签名自验）/
# web-static（前端静态资源内嵌）/ lsp（LSP 语义代码查询）/
# checkpoint-git（checkpoint 影子库）/ image-process（图片降采样）/
# history-search（FTS 会话检索）/ usage-store（SQLite 用量账本）。
# IoT/极小镜像预设全关（合计约省 3-4MB），消费版保持默认。
[[feature]]
id = "pricing-embed"
label = "内嵌价目表"
desc = "编译期内嵌 ~2800 条模型价目（LiteLLM 派生，+0.6MB），usage 成本核算数据源。关后成本恒 0.0（诚实降级），运行期下载层与自定义价目照常。IoT/极小镜像建议关"
category = "subsystems"
default = true

[[feature]]
id = "verify"
label = "启动签名自验"
desc = "启动时验证自身签名（v4 Authenticode，锁定版强制链基础；WSAPI signature status 随它进出）。皮肤验签与版本自切换验签不受影响。IoT/可信环境建议关"
category = "subsystems"
default = true

[[feature]]
id = "web-static"
label = "内嵌前端资源"
desc = "编译期内嵌 Dashboard 前端（裁剪后 ~1.2MB），零磁盘 IO 服务。关后只剩 exe 旁 static/ 目录磁盘兜底（没有则页面 404）。IoT/纯 API 形态建议关"
category = "subsystems"
default = true

[[feature]]
id = "lsp"
label = "LSP 语义代码查询"
desc = "只读 LSP 客户端（lsp 工具 definition/references/implementation/hover + 诊断回灌 + coding.lsp_install）。运行闸 config agents.lsp_tool 默认关，编译内含 ~0.2MB。IoT 建议关"
category = "subsystems"
default = true

[[feature]]
id = "checkpoint-git"
label = "Checkpoint 影子库（git）"
desc = "D2 checkpoint git 影子库（libgit2 ~1.5MB）：turn 边界全工作区快照，shell 副作用也覆盖。关后 checkpoint 恒走 JSON 快照回落（逐 turn JSON 文件，rewind/undo 照常，工具声明外的 exec 副作用不覆盖）。IoT 建议关"
category = "subsystems"
default = true

[[feature]]
id = "image-process"
label = "图片降采样"
desc = "J6 多模态超限图片自动降采样（image crate ~0.8MB：4096→2048→1024 阶梯 + JPEG q85）。关后超限图按原图链路走，>25MB 照旧被验真链诚实拒绝。IoT/无多模态建议关"
category = "subsystems"
default = true

[[feature]]
id = "history-search"
label = "会话全文检索（FTS）"
desc = "U20 跨会话聊天记录全文检索（SQLite FTS5）：history_search 工具 + CLI + Dashboard 日志页。关后三处诚实报未编译。与 usage-store 一起构成 SQLite 拆分两半（账本本体随 usage-store 进出）。IoT 建议关"
category = "subsystems"
default = true

[[feature]]
id = "usage-store"
label = "用量账本（SQLite）"
desc = "LLM 用量账本（nemesis-data DataStore，rusqlite bundled ~1MB）：usage 统计/请求明细/模型健康/会话成本随它进出。关后写入 no-op、查询恒空（价目层 JSON 照常，open 时 warn 一次），生产调用方零改动。IoT/极小镜像建议关（省 iotsmall 里最后一个 SQLite）"
category = "subsystems"
default = true

# ── Frontend-only gate (no Rust code; exists in nemesisbot/Cargo.toml [features]
#    only so `nemesis-config check` passes) ────────────────────────────────

[[feature]]
id = "usage"
label = "使用统计页（含图表）"
desc = "Dashboard 使用统计页（UsageView），引入 echarts(~558KB)。IoT/无图表需求建议关；裁后页面+echarts 从前端 tree-shake 掉。Rust 侧 no-op"
category = "subsystems"
default = true

[[feature]]
id = "skins"
label = "皮肤包系统"
desc = ".nbskin 皮肤包加载/签名验证/设置页「皮肤」tab（/skins/* 分发 + WSAPI skins.* + 前端热切）。裁后路由+管理面+前端 tab 整体消失（nemesis-verify 依赖随 skins 进出）"
category = "subsystems"
default = true

# ── Build profile (cargo profile, not a feature) ───────────────────────────

[[feature]]
id = "build-profile"
label = "构建 profile"
desc = "release（默认，带 unwind）/ iotsmall（最小体积，panic=abort）"
category = "build"
type = "enum"
default = "release"
options = ["release", "iotsmall"]
