category = "subsystems"
default = true

[[feature]]
id = "desktop"
label = "桌面集成"
desc = "系统托盘 + 审批弹窗 + 子进程窗口（plugin-ui）。IoT/无头建议关闭"
category = "subsystems"
default = true

[[feature]]
id = "health"
label = "健康检查服务"
desc = "/health 端点 + 就绪探针"
category = "subsystems"
default = true

[[feature]]
id = "heartbeat"
label = "心跳服务"
