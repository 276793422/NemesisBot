[package]
name = "nemesis-web"
version.workspace = true
license.workspace = true
edition.workspace = true

# P2-2 (2026-08-24 UI entry gap): compile-time packaging of the Python SDK
# (test-tools/python/sdk) into the two zips embedded by sdk_embed.rs. Same
# `zip` crate the rest of the workspace already uses (nemesis-utils/skills/
# sandbox/security); deflate-only keeps the build script light.
[build-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies]
nemesis-types = { workspace = true }
nemesis-bus = { workspace = true }
nemesis-providers = { workspace = true }
nemesis-config = { workspace = true }
nemesis-cluster = { workspace = true, optional = true }
# 行动代理连接器数据面（handlers/connectors.rs；`connectors` feature 门控——
# 它无条件依赖 nemesis-security，关 = security 一并退出依赖图）。
nemesis-connectors = { workspace = true, optional = true }
nemesis-forge = { workspace = true, optional = true }
nemesis-skills = { workspace = true }
nemesis-security = { workspace = true, optional = true }
nemesis-sandbox = { workspace = true, optional = true }
nemesis-cron = { workspace = true }
# 看板存储（board.* WSAPI / team.* / 看板资产端点；`board` feature 门控——
# rusqlite bundled 随它进出，iotsmall 里最后一个 SQLite 来源）。
nemesis-board = { workspace = true, optional = true }
nemesis-services = { workspace = true }
nemesis-voice = { workspace = true, optional = true }
nemesis-memory = { workspace = true, optional = true }
nemesis-data = { workspace = true }
# 目录缓存路径唯一真相源在 nemesis-path（models_catalog_cache_path 等，
# 与 CLI catalog.rs 共用——nemesis-web 不能依赖 binary crate）。
nemesis-path = { workspace = true }
nemesis-agent = { workspace = true }
# MCP sanitize 前缀碰撞检测单一真相源（handlers/mcp.rs server_add 写面
# warn，与 nemesis-mcp manager 加载面同源 helper；2026-10-16 第十四轮）。
nemesis-mcp = { workspace = true }
# WASM 插件管理面（handlers/plugins_wasm.rs；`plugins-wasm` feature 门控，
# nemesisbot feature 转发）。
nemesis-plugins-wasm = { workspace = true, optional = true }
nemesis-workflow = { workspace = true, optional = true }
nemesis-utils = { workspace = true }
# 提示词资产单一真相源（M7）：cluster_persona_gen（人格生成三阶段）消费；
# 零依赖纯静态文本，直接非 optional。
nemesis-prompts = { workspace = true }
# P2-1 (2026-08-24 UI entry gap): coding.lsp_status probes the language-server
# registry table (SERVERS / server_available). Unconditional, mirroring
# nemesis-agent's own non-optional dependency on nemesis-lsp.
nemesis-lsp = { workspace = true, optional = true }
# L8 PTY 内嵌终端（dashboard 终端 tab；`terminal` feature 门控）
portable-pty = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
dashmap = { workspace = true }
http = "1"
url = "2"
# 皮肤包（.nbskin = 单文件 ZIP）运行时解析（skins.rs）；与 build/dev 侧
# 同一 crate 同一 feature 集（deflate-only）。`skins` feature 门控——关掉
# 后 zip + nemesis-verify 整体退出依赖图（verify 是本功能的实现依赖，
# 随 skins 进出，见计划 §3.7）。
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
# v4 签名验证（.nbskin 来源徽标；管理面按需验签，见 skins.rs）。
nemesis-verify = { workspace = true, optional = true }
async-trait = { workspace = true }
tokio-util = { version = "0.7", features = ["rt", "io"] }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[features]
# Optional subsystems (not in default — enabled via feature passthrough from
# the `nemesisbot` binary so a trimmed build can drop them).
voice = ["dep:nemesis-voice"]
# voice-capture：设备 IO 面板/实时采集/回声消除（穿透 nemesis-voice/voice-capture）。
# voice（STT/TTS/云转写）不隐含本 feature——IoT 可只留转写不带设备 IO。
voice-capture = ["voice", "nemesis-voice/voice-capture"]
cluster = ["dep:nemesis-cluster"]
forge = ["dep:nemesis-forge"]
memory = ["dep:nemesis-memory"]
workflow = ["dep:nemesis-workflow"]
security = ["dep:nemesis-security", "nemesis-security/security"]
# scanner：病毒扫描管理面（WSAPI scanner.* + Dashboard ScannerView 后端）。
# implies security（第 7 层在 pipeline 内），并穿透 nemesis-security/scanner。
scanner = ["security", "nemesis-security/scanner"]
sandbox = ["dep:nemesis-sandbox"]
# WASM 插件管理面（plugins.wasm.* WSAPI；宿主运行时整槽注入）。
# dep:zip = wasm.devkit_download 的解包（与 skins 共享同一 crate 同一
# feature 集；skins 关、plugins-wasm 开的构建也能解包）。
plugins-wasm = ["dep:nemesis-plugins-wasm", "dep:zip"]
terminal = ["dep:portable-pty"]
# 皮肤包加载/签名验证/WSAPI 管理面（skins.rs + handlers/skins.rs + 路由
# 挂载点）。zip 与 nemesis-verify 是本功能的实现依赖，随 skins 进出。
skins = ["dep:zip", "dep:nemesis-verify"]
# L9 版本自切换通道（selfupdate.rs apply 编排：v4 验签 + zip 解包 + 审批 +
# 审计链，implies security）。check/status/journal/boot 收口不门控。
selfupdate = ["security", "dep:zip", "dep:nemesis-verify"]
# LSP 语义代码管理面（coding.lsp_status/lsp_install WSAPI + server 持有的
# LspManager 单例槽；由 nemesisbot 的 lsp feature 穿透）。关 = 两条命令
# 诚实报未编译，coding.config（纯 config 读写）照常。
lsp = ["dep:nemesis-lsp"]
# U20 会话全文检索管理面（logs.history_search / logs.history_reindex
# WSAPI；消费 nemesis-agent 的 history_search FTS 模块，随其 feature 进出；
# 由 nemesisbot 的 history-search feature 穿透）。关 = 两条命令诚实报未编译。
history-search = ["nemesis-agent/history-search"]
# 看板管理面（board.* WSAPI + team_memory + 看板资产下载端点 + server/board
# 注入槽）。由 nemesisbot 的 board feature 穿透；关 =nemesis-board 整包退出
# 依赖图（rusqlite bundled 随之消失），board 命令从注册表面消失。
board = ["dep:nemesis-board"]
# 行动代理连接器管理面（connectors.* / paperbroker.* WSAPI；由 nemesisbot
# 的 connectors feature 穿透）。关 = handler 整体退出注册表面。
connectors = ["dep:nemesis-connectors"]

[dev-dependencies]
tempfile = "3"
# usage-store 行为测试经 dev-dependencies 带回真 SQLite 账本（resolver 2：
# dev-dep features 不泄漏到正常构建——正常构建按需编译空账本 stub）。
nemesis-data = { workspace = true, features = ["usage-store"] }
# 资产下载端点 oneshot 请求测试（board_asset/tests.rs）：tower util
# feature 提供 .oneshot()；http-body-util 收集响应 body；bytes 是其产物类型。
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
bytes = "1"
# S10a 覆盖率（2026-08-26）：workflow 同步 run 超时臂测试用
# #[tokio::test(start_paused = true)] 暂停时钟（test-util 不在 "full" 内，
# 仅测试用，不进生产依赖图）。
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
# Phase 3 覆盖率（2026-08-25）：server setter 全扫测试要构造
# WorkflowEngine::new_integrated 的 ToolRegistry 参数（仅测试用，
# 不进生产依赖图）。
nemesis-tools = { workspace = true }
# Phase 3 覆盖率（2026-08-25）：sse_chat handler 测试用 wiremock 起 SSE 假
# LLM 后端（与 nemesis-providers 同版本），全程进程内无 TCP 端口竞争。
wiremock = "0.6"
# P2-2: sdk_embed tests open the embedded bytes as a real archive (structural
# round-trip — the guarantee that unzip/pip install work, not just non-empty).
zip = { version = "9", default-features = false, features = ["deflate"] }
# memory handler agt_tests 用共享 ONNX fixture 喂真实 MemoryManager——
# `init_vector_store_with_embed` 门在 nemesis-memory 的 `test-fixture` feature
# 后（与 nemesis-agent dev-deps 同款模式；仅测试用，不进生产依赖图）。
nemesis-memory = { workspace = true, features = ["test-fixture"] }
# board 测试造「存量幽灵引用」行（引用完整性闸 2026-10-17 后 create/update
# 不再接受不存在的 project/parent，防御臂只能以直接 SQL 复刻存量态）。
# 仅测试用；feature 与 nemesis-board 声明合并（bundled 加法统一，单次编译）。
rusqlite = "0.34"

[lints]
workspace = true
