[package]
name = "nemesis-cluster"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-config = { workspace = true }
nemesis-types = { workspace = true }
# 统一任务层（P1）：生产任务真相源换 tasks.db（SqliteTaskStore 适配 +
# 审批台账共享同库）。trait 适配 impl 在本 crate（task_store_sqlite.rs）。
nemesis-taskstore = { workspace = true }
# 集群专业职能框架（M3）：peer_chat 载荷 slug 归一（零依赖提示词资产层）。
nemesis-prompts = { workspace = true }
# 集群路径（peers.toml/state.toml/rpc_cache/config.cluster.json）唯一真相源在
# nemesis-path，cluster.rs / config_loader.rs 经它取路径，禁止各自 join。
nemesis-path = { workspace = true }
nemesis-utils = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 分块传输通道（P3/D1）：chunk payload base64 进 JSON（逐块有界，非整包）。
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
toml = { workspace = true }
# A1 iroh 跨网 P2P 叠加层（feature=cluster-roaming）：QUIC 自证端点 + 中继打洞。
iroh = { workspace = true, optional = true }
# iroh-relay：server 面专用（roaming-relay feature）。client 面类型
# （RelayUrl/RelayConfig/RelayMap）全部经 iroh 根 re-export 可命名
# （lib.rs:282-290），cluster-roaming 单开时零直依赖零编译增量；server 面
# （rcgen/ACME/tokio-websockets 等编译增量）只随 roaming-relay 进编译。
iroh-relay = { workspace = true, optional = true }
# QUIC 中继服务器证书自签（rcgen）+ rustls ServerConfig 组装——两 crate 已在
# iroh-relay server 依赖树内，直接声明仅为可命名。
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# roaming 密钥 hex 编解码（node_id/seed 的文本形态）。
hex = { workspace = true }
if-addrs = "0.13"
socket2 = { workspace = true }
# per-task cancel（W2 P4）：CancellationToken 供 cluster_agent 的 agent loop
# 中断执行中的任务（与 nemesis-agent / nemesisbot 同版本声明）。
# 纯用户态原语全平台可用——cluster_task.rs 无条件使用，不能进 windows target
# 段（错置实录：Linux CI E0433 两连红，2026-10-14）。
tokio-util = { version = "0.7", features = ["rt"] }
# R1（Win↔Win 集群地址缺陷链）：if_addrs 在 Windows 上不枚举 169.254/16
# APIPA 地址（ipconfig 明有、枚举结果无，2026-10-12 三机验收实测）——
# GetAdaptersAddresses 补齐，link-local 是直连/ICS 拓扑的唯一互通地址。
# 版本与本仓 nemesis-security / nemesis-sandbox 的 0.59 对齐，不新增依赖家族。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[features]
# A1 iroh 跨网 P2P 叠加层（2026-10-18）：默认关——LAN 用户零新依赖；开启后
# endpoint/trust/bridge 三模块进编译，peer_chat/探针支持 `iroh:<node_id>` 地址。
cluster-roaming = ["dep:iroh"]
# QUIC 中继服务器（2026-10-21）：自建 iroh 中继回落服务器（内网穿透）。
# 隐含 cluster-roaming（中继服务于叠加层，主从关系）；server 面编译增量
# （rcgen/ACME/tokio-websockets 等）只在开 roaming-relay 时进编译。
roaming-relay = ["cluster-roaming", "iroh-relay/server", "dep:rcgen", "dep:rustls"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
