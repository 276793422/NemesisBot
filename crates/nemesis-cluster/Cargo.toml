[package]
name = "nemesis-cluster"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-config = { workspace = true }
nemesis-types = { workspace = true }
# 统一任务层（P1）：生产任务真相源换 tasks.db（SqliteTaskStore 适配 +
# 审批台账共享同库）。trait 适配 impl 在本 crate（task_store_sqlite.rs）。
nemesis-taskstore = { workspace = true }
# 集群专业职能框架（M3）：peer_chat 载荷 slug 归一（零依赖提示词资产层）。
nemesis-prompts = { workspace = true }
# 集群路径（peers.toml/state.toml/rpc_cache/config.cluster.json）唯一真相源在
# nemesis-path，cluster.rs / config_loader.rs 经它取路径，禁止各自 join。
nemesis-path = { workspace = true }
nemesis-utils = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 分块传输通道（P3/D1）：chunk payload base64 进 JSON（逐块有界，非整包）。
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
toml = { workspace = true }
# QUIC 插件化 M2：C-ABI 桥消费面（身份/名册控制面在 plugin_roaming；dlopen
# 与句柄装载在 nemesisbot loader，cluster 侧只经 roaming::plugin_bridge 调插件）。
# M4 起非 optional——cluster-roaming feature 已删（拍板②），桥消费面恒编译。
nemesis-plugin = { workspace = true }
# node_id hex on-curve 校验（QUIC 插件化 M3 宿主侧重实现：iroh EndpointId
# 已随端点迁入插件，VerifyingKey::from_bytes 与 EndpointId::from_bytes 同语义
# ——announce 入池前置闸）。M4 起非 optional（同上，随桥消费面恒编译）。
ed25519-dalek = { workspace = true }
# roaming 密钥 hex 编解码（node_id/seed 的文本形态）。
hex = { workspace = true }
if-addrs = "0.13"
socket2 = { workspace = true }
# per-task cancel（W2 P4）：CancellationToken 供 cluster_agent 的 agent loop
# 中断执行中的任务（与 nemesis-agent / nemesisbot 同版本声明）。
# 纯用户态原语全平台可用——cluster_task.rs 无条件使用，不能进 windows target
# 段（错置实录：Linux CI E0433 两连红，2026-10-14）。
tokio-util = { version = "0.7", features = ["rt"] }
# R1（Win↔Win 集群地址缺陷链）：if_addrs 在 Windows 上不枚举 169.254/16
# APIPA 地址（ipconfig 明有、枚举结果无，2026-10-12 三机验收实测）——
# GetAdaptersAddresses 补齐，link-local 是直连/ICS 拓扑的唯一互通地址。
# 版本与本仓 nemesis-security / nemesis-sandbox 的 0.59 对齐，不新增依赖家族。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[features]
# A1 iroh 跨网 P2P 叠加层（2026-10-18 建档 → 2026-10-23 QUIC 插件化 M1/M2/M3
# 渐次搬插件 → 2026-10-24 M4 **feature 删除**，拍板②「少一个 feature 少一分
# 组合矩阵」）：iroh 端点/中继/名册全部在 plugin_roaming C-ABI 插件；cluster
# 侧桥消费面（plugin_bridge / 拨号臂 / accept 臂 / on-curve 校验）恒编译，
# 插件缺席 = 运行期诚实报错（宿主 loader 拒装 + 桥调用降级）。本 crate 的
# feature 数组不再存在；iroh 家族依赖只活在插件 crate。
# （原 quic-relay 空壳 feature 一并删除——中继运行面自 M1 起整体在插件内。）

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
