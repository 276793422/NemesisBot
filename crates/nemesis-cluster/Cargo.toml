[package]
name = "nemesis-cluster"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-config = { workspace = true }
nemesis-types = { workspace = true }
# 集群专业职能框架（M3）：peer_chat 载荷 slug 归一（零依赖提示词资产层）。
nemesis-prompts = { workspace = true }
# 集群路径（peers.toml/state.toml/rpc_cache/config.cluster.json）唯一真相源在
# nemesis-path，cluster.rs / config_loader.rs 经它取路径，禁止各自 join。
nemesis-path = { workspace = true }
nemesis-utils = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 分块传输通道（P3/D1）：chunk payload base64 进 JSON（逐块有界，非整包）。
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
toml = { workspace = true }
if-addrs = "0.13"
socket2 = { workspace = true }
# per-task cancel（W2 P4）：CancellationToken 供 cluster_agent 的 agent loop
# 中断执行中的任务（与 nemesis-agent / nemesisbot 同版本声明）。
# 纯用户态原语全平台可用——cluster_task.rs 无条件使用，不能进 windows target
# 段（错置实录：Linux CI E0433 两连红，2026-10-14）。
tokio-util = { version = "0.7", features = ["rt"] }
# R1（Win↔Win 集群地址缺陷链）：if_addrs 在 Windows 上不枚举 169.254/16
# APIPA 地址（ipconfig 明有、枚举结果无，2026-10-12 三机验收实测）——
# GetAdaptersAddresses 补齐，link-local 是直连/ICS 拓扑的唯一互通地址。
# 版本与本仓 nemesis-security / nemesis-sandbox 的 0.59 对齐，不新增依赖家族。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
serial_test = "3"

[lints]
workspace = true
