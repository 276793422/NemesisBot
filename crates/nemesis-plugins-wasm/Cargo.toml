[package]
name = "nemesis-plugins-wasm"
version.workspace = true
edition.workspace = true

description = "NemesisBot WASM 插件框架宿主面（壳 DLL 装载 + 句柄 ABI + 装配准入；wasmtime 在宿主壳内）"
license = "AGPL-3.0-only"

[dependencies]
# 宿主壳 DLL 装载（wasmtime 只进壳，exe 侧零重依赖）
libloading = "0.8"
base64.workspace = true

# 内部层（types 事件源 / security 签名+扫描+操作注册表 / utils 原子写 /
# config 开关文件真相源 config.plugin.wasm.json）
nemesis-types = { workspace = true }
nemesis-security = { workspace = true, features = ["scanner"] }
nemesis-utils = { workspace = true }
nemesis-config = { workspace = true }

# 基础
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
hex = "0.4"
reqwest.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
