[package]
name = "nemesis-state"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
# workspace state 目录唯一真相源在 nemesis-path。
nemesis-path = { workspace = true }
# 内部通道判断单一真相源在 nemesis-types。
nemesis-types = { workspace = true }
# BUG-20261025-51：状态落盘走唯一临时名原子写权威 helper（nemesis_utils::file）。
nemesis-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
# BUG-20261114-026 回归锁：state.json 损坏加载 loud 留痕断言用
# （fmt subscriber + 缓冲 writer 捕获 warn 日志；对齐 BUG-20261025-38 先例）。
tracing-subscriber = { workspace = true }

[lints]
workspace = true
