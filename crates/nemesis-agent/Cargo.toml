[package]
name = "nemesis-agent"
version.workspace = true
license.workspace = true
edition.workspace = true

# Class C 子系统 feature（默认全开 = 现状；可通过 `--no-default-features` 关闭）。
# 这些 crate 被 nemesis-agent 硬引用，所以 agent 自身也要开 feature 体系并在源码里 cfg-gate。
# 见 docs/PLAN/2026-07-01_feature-trimming-and-build-configurator.md Phase 5。
[features]
default = ["codemode", "forge", "memory", "workflow", "security"]
# T2（L1 codemode）：code_run 脚本工具（rquickjs QuickJS 引擎随它进出；
# 关 = 无 code_run 工具，IoT/极小镜像可裁）。运行开关是 config
# agents.codemode.enabled（默认关）——编译期与运行期双闸同 hidden_tools 模型。
codemode = ["dep:rquickjs"]
forge = ["dep:nemesis-forge"]
memory = ["dep:nemesis-memory"]
workflow = ["dep:nemesis-workflow"]
security = ["dep:nemesis-security", "nemesis-security/security", "nemesis-skills/security", "dep:nemesis-connectors"]

[dependencies]
nemesis-types = { workspace = true }
nemesis-prompts = { workspace = true }
nemesis-config = { workspace = true }
nemesis-utils = { workspace = true }
nemesis-routing = { workspace = true }
nemesis-skills = { workspace = true }
nemesis-memory = { workspace = true, optional = true }
nemesis-mcp = { workspace = true }
nemesis-lsp = { workspace = true }
nemesis-tools = { workspace = true }
nemesis-cron = { workspace = true }
nemesis-forge = { workspace = true, optional = true }
nemesis-workflow = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 对话生成（2026-09-22）：workflow_edit 命名会话渲染当前定义 YAML（与
# nemesis-workflow 落盘序列化同源，draft/定义字节一致）。
serde_yaml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
nemesis-observer = { workspace = true }
nemesis-security = { workspace = true, optional = true }
# connector denied_approval 凭条（行动代理 P0）：dispatch 的 ABAC deny 分支
# 代写回执——审批拒绝发生在工具 execute 之前，工具自身写不了。随 security
# feature 进出（凭条语义绑定安全管线）。
nemesis-connectors = { workspace = true, optional = true }
nemesis-state = { workspace = true }
nemesis-data = { workspace = true }
nemesis-path = { workspace = true }
# T9（多模态 goal 2026-09-03）：URL 图片拉取走共享连接池（超时/UA/连接复用）。
nemesis-http-pool = { workspace = true }
parking_lot = { workspace = true }
# I1（devtool-upgrade 阶段 3）：workspace fs watcher（跨平台递归 watch）。
notify = "8"
# WS9/P22：workspace 写租约的 OS 级文件锁（Windows LockFileEx / POSIX
# flock；持有进程死亡自动释放——无死锁遗留）。
fd-lock = "4"
# D2（devtool-upgrade 阶段 5）：checkpoint git 影子库（default-features=false 无 openssl）。
git2 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# T1（扩展计划 D3）：工具收据 HMAC-SHA256——防幻觉执行证明。
hmac = { workspace = true }
# T1：ReceiptKey 随机生成（OsRng OS 熵源）。
rand = { workspace = true }
# J6（devtool-upgrade 阶段 6）：图片超限自动降采样（与 nemesis-desktop /
# plugin-ui 同版本，cargo 自动统一编译单元）。
image = "0.25"
reqwest = { workspace = true }
regex = { workspace = true }
# J2b（devtool-upgrade 阶段 4）：web_fetch HTML → 可读文本提取（html5ever 解析，
# 链接/列表/标题结构保留；默认 features 即核心渲染，css/xml 关闭）。
html2text = "0.17"
# U20 (sixth batch): FTS5 index for session full-text search. Same version +
# features as nemesis-data's rusqlite — Cargo compiles the bundled SQLite once.
rusqlite = { version = "0.34", features = ["bundled"] }
# T2（L1 codemode）：code_run 脚本工具的 JS 引擎（optional，随 codemode
# feature）。**声明在下方 target 门控表**——rquickjs-sys 0.14 预生成
# bindings 不含任何 *-linux-android 三元组（bindgen 运行时生成需宿主接管
# NDK sysroot，不可取），android 上 codemode feature 静默无依赖，code_run
# 模块/注册点同 cfg 诚实缺席，其余平台默认 feature 不变
#（2026-10-13 android 交叉检查抓出）。

[target.'cfg(not(target_os = "android"))'.dependencies]
rquickjs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
mockall = { workspace = true }
nemesis-providers = { workspace = true }
# S9 (quality-hardening goal 冲刺 S9): thread-local subscriber so tracing macro
# field expressions (info!/warn!/debug! args) get evaluated in tests — without a
# subscriber those lines never count as covered. Same pattern as
# nemesis-sandbox/src/test_util.rs.
tracing-subscriber = { workspace = true }
# Y1 (Phase4-a): loop-level folding tests inject a deterministic fake embed
# backend into a real MemoryManager — `init_vector_store_with_embed` is gated
# behind nemesis-memory's `test-fixture` feature.
nemesis-memory = { workspace = true, features = ["test-fixture"] }
tempfile = "3"

[lints]
workspace = true
