[package]
name = "nemesis-utils"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# guest 交叉构建守卫（BUG 2026-10-30）：reqwest（→rustls→ring 含 C 源码）改为可选依赖——
# 只有启用 `http` feature 的消费方才把 reqwest 拉进依赖图；nemesis-guest（musl 静态 ELF，
# 交叉构建本机无 musl C 工具链）保持零 feature 纯 Rust 依赖树。
reqwest = { workspace = true, optional = true }
parking_lot = { workspace = true }
# llm_error_class（T2a 下沉）：错误文本分类的正则模式（与 providers 侧同源 workspace 版本）。
regex = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }
# B10（2026-10-18 存储韧性）：SQLite 打开面前置守卫模块的可选依赖——
# 只有启用 `sqlite-preflight` feature 的消费方（nemesis-data / nemesis-board）
# 才会把 rusqlite 拉进依赖图，未启用方零成本。
rusqlite = { workspace = true, optional = true }

[features]
sqlite-preflight = ["dep:rusqlite"]
# 同 sqlite-preflight 模式：只有启用 `http` 的消费方才把 reqwest（含 ring C 代码）
# 拉进依赖图，未启用方零成本。
http = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# dev-deps 不进消费方依赖图：llm_error_class 测试（真实 reqwest 连接失败钉 Display 形态）
# 与 http_retry 的 reqwest 测试在无 `http` feature 时照常编译运行。
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
# wait_ready 测试的 start_paused 虚拟时钟（full 不含 test-util）。
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
