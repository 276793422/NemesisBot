[package]
name = "nemesis-sandbox"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-types = { workspace = true }
nemesis-path = { workspace = true }
nemesis-utils = { workspace = true }
# P5：wire 协议薄 crate（guest agent v2 请求/响应 + call_id 单一真相源）。
nemesis-exec-protocol = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
bytes = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# P21（2026-09-25）：沙盒拒绝台账的时间戳（RFC3339 UTC，毫秒精度）。
chrono = { workspace = true }
# MXC 护栏后端（mxc feature 门控，2026-11-14）：path 指 submodule `3rd/mxc`
# （钉 4e522623，根目录无 Cargo.toml 故 git-rev 依赖形态不可行，PLAN §4.1）。
# upgrade 流程：submodule advance + PLAN 钉版记录同 commit 更新。
# 遥测红线（PLAN §3.1）：mxc-sdk 的 Windows release 构建默认捆绑微软签名遥测
# 路由 DLL（4 个 Required 事件、无需用户同意）。本仓库经根 `.cargo/config.toml`
# [env] 强制 `MXC_TELEMETRY_COMPONENT_PATH=""`（官方关闭面——路由元数据只能来自
# 该 DLL，空 = 无 WinExt 路由组 = 事件只进本机 ETW，到不了微软）。强制点单一，
# 不在构建脚本散布导出。
mxc-sdk = { path = "../../3rd/mxc/src/mxc-sdk", optional = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
# P5 vm 单测：QMP 客户端回归（fake QEMU 控制面）+ 进程内 guest 全链回归。
fake-qmp = { path = "../../test-tools/fake-qmp" }
nemesis-guest = { path = "../nemesis-guest" }

# U11 userland sandbox: landlock LSM bindings (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# P24（2026-09-25 能力扩展 WS1）：Windows ACL 用户态轻量档。windows-sys 比
# windows 轻，只用 needed features（与本仓 nemesis-security / nemesisbot 的
# 0.59 版本对齐，不新增依赖家族）。⚠ cargo 不支持 target cfg 里放 feature
# 判据——依赖挂 Windows target 上；`acl` feature 关掉时 acl_impl 不编译，
# 此依赖只挂名不参与代码路径。
[features]
default = ["acl"]
## P24：Windows ACL 沙盒后端（完整性标签 + DACL 原语）。关掉后 Windows 上
## 也编译 stub（availability=Unavailable），给定制构建留裁剪位。实验性档位。
acl = []
## P5（桌面级 VM，2026-10-17）：VM 后端模块（GuestArch/QEMU 装配/QMP 客户端/
## 镜像与 overlay 管理/NAT-TCP 通道/生命周期）。关 = 整个 vm 模块不编译，
## executor.vm 配置缺消费者（诚实报未编译）。由 nemesisbot 的 vm feature 穿透。
vm = []
## MXC 后端（2026-11-14）：Microsoft eXecution Container 护栏后端（opt-in）。
## 依赖 = submodule `3rd/mxc`（钉 4e522623）的 mxc-sdk，path 引用（见顶部
## [dependencies] 的 mxc-sdk 条目注记）。关 = mxc_backend.rs 整模块不编译，
## executor.backend="mxc" 诚实报未编译。由 nemesisbot 的 sandbox-mxc
## feature 穿透。见 2026-11-14_mxc-sandbox-integration.md（归档于 docs/REPORT）。
mxc = ["dep:mxc-sdk"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# P5 第 2 步：真机冒烟（KVM/WHPX 宿主 + 已制备镜像）；required-features 让
# vm 关态下 cargo test/check 跳过本 target（vm 模块都不在编译，示例无从谈起）。
[[example]]
name = "vm_smoke"
required-features = ["vm"]

# P5 第 3 步 E 线：睡眠/唤醒/持久重挂实机真腿（KVM 宿主；WHPX 诚实 SKIP）。
[[example]]
name = "vm_lifecycle_kvm"
required-features = ["vm"]

# VM 环境自举 B1：Windows 全新环境 QEMU 安装链实跑（下载/校验/直解/落位/探针）。
[[example]]
name = "vm_install_arm"
required-features = ["vm"]

# VM 环境自举 B2：probe 状态机真机直证（双端只读：presence/accel facts/
# 分类器输出；Linux 半自动安装链 / Windows WHPX 早退）。
[[example]]
name = "vm_bootstrap_arm"
required-features = ["vm"]

# VM 演示线（008657b9）：浏览器取证全链真机演示（VNC 显示 + guest browser
# 工具链）。vm 模块 feature 门控，example 必须同门控——否则关 feature 构建
# 时 examples 自动发现编译撞 unresolved import（workspace 全量实测 2026-10-24）。
[[example]]
name = "vm_browser_forensic"
required-features = ["vm"]

[lints]
workspace = true
