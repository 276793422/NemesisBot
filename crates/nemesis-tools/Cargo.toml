[package]
name = "nemesis-tools"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-types = { workspace = true }
nemesis-prompts = { workspace = true }
nemesis-skills = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
nemesis-path = { workspace = true }
# web_fetch SSRF 字面量闸的 URL 解析（url crate 真实解析替代旧自写极简
# 解析器——userinfo/IPv6/非点分十进制六形态绕过，BUG-20261125-028）。
url = { workspace = true }
# exec env 清洗（T4/D2a）：spawn 前剥凭据类继承变量（黑白名单单点在此 crate）。
nemesis-utils = { workspace = true, features = ["http"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
mockall = { workspace = true }
tempfile = "3"
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
