[package]
name = "nemesis-workflow"
version.workspace = true
license.workspace = true
edition.workspace = true

# BUG-20261102-324：SSRF 闸槽随 security feature（optional dep，关 security
# 时整块 cfg 掉——workflow 引擎本体不拖 nemesis-security，IoT 裁剪树不受扰；
# 关 = http 节点无闸直通，但重定向纪律仍生效）。
[features]
security = ["dep:nemesis-security", "nemesis-security/security"]

[dependencies]
nemesis-types = { workspace = true }
nemesis-prompts = { workspace = true }
nemesis-providers = { workspace = true }
nemesis-tools = { workspace = true }
nemesis-data = { workspace = true }
nemesis-sandbox = { workspace = true }
nemesis-config = { workspace = true }
nemesis-security = { workspace = true, optional = true }
nemesis-utils = { workspace = true }
nemesis-taskstore = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
croner = "3"
sha2 = { workspace = true }
argon2 = "0.5"
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
# usage-store 行为测试经 dev-dependencies 带回真 SQLite 账本（resolver 2：
# dev-dep features 不泄漏到正常构建——正常构建按需编译空账本 stub）。
nemesis-data = { workspace = true, features = ["usage-store"] }

[lints]
workspace = true
