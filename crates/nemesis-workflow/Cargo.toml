[package]
name = "nemesis-workflow"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
nemesis-types = { workspace = true }
nemesis-prompts = { workspace = true }
nemesis-providers = { workspace = true }
nemesis-tools = { workspace = true }
nemesis-data = { workspace = true }
nemesis-sandbox = { workspace = true }
nemesis-config = { workspace = true }
nemesis-utils = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
croner = "3"
sha2 = { workspace = true }
argon2 = "0.5"
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
# usage-store 行为测试经 dev-dependencies 带回真 SQLite 账本（resolver 2：
# dev-dep features 不泄漏到正常构建——正常构建按需编译空账本 stub）。
nemesis-data = { workspace = true, features = ["usage-store"] }

[lints]
workspace = true
