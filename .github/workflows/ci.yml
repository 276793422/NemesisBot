name: CI

# H1 质量门禁（project-health v2，见 docs/PLAN/2026-08-31_project-health-improvement-v2.md §H1）
#
# 初版范围（2026-08-31）：
#   - ✅ cargo check / 全量测试 / inline-tests 纪律闸 / clippy -D warnings（阻塞门禁）/ 前端三件套
#   - ✅ fmt --check 门禁（2026-09-02 H5 fmt 基线落地后补装；基线=两遍 cargo fmt --all
#     收敛不动点，647 文件重排，零语义变化证据见归档 goal 报告）
#
# clippy 门禁说明：H2 已完成全库清零（基线 1195w+10e → 0w+0e，2026-08-31，
# 六轮全量验证），自本次起 `-D warnings` 阻塞 CI。新的 clippy 警告必须当场修，
# 禁止用 #[allow] 掩盖（确需 allow 必须带理由注释）。
#
# 平台策略：
#   - check/clippy/冒烟 + 前端在 Linux（快、便宜）；
#   - 全量 workspace 测试在 Windows（本地 21,373/0 基线即 Windows，平台一致保证
#     "全绿"承诺诚实；Linux 全量测试放 extended-tests nightly 长期验证）。
#
# 关键前置：crates/nemesis-web/static/ 被 .gitignore（vite 构建产物），而 nemesisbot
# 编译时经 include_dir! 嵌入它（nemesisbot/src/embedded.rs）——所以任何 cargo 步骤
# 之前必须先建 Vue 前端，否则 include_dir! 展开即失败。
#
# 前端可复现构建：package-lock.json 入库后统一用 npm ci（npm install 策略仅保留在
# 本地构建脚本 build-windows.bat / build-linux.sh）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发入口（Actions 页 "Run workflow" 按钮，2026-10-11 补装）。此前只有
  # push/PR 两个触发器——没有 dispatch 就没有手动点燃按钮。push/PR 行为不变。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR 连推新提交时取消旧 run；main 上同理省 runner 时长
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust check + inline-tests + clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 平台环境指纹（2026-10-12 设备归因纪律，所有测试 job 前置）：把分配到的
      # VM 完整身份落日志 + step summary，十个域：runner 身份+镜像波次
      # (ImageVersion)/OS build(UBR)/虚拟化+磁盘/CPU(型号/核数/基频/缓存)+算力
      # 探针/内存(总量/余量/commit/DIMM频率/页面文件)/磁盘(容量/余量)+顺序写探针
      # /网络(NIC+github.com RTT)/限额+负载/安全软件(Defender)+电源计划/工具链
      # 基线版本。探针（CPU 算力环、磁盘写、ping）同方法跨 VM 可比——「慢机族」
      # 归因从猜变查。此后慢机/冻结/失联一律先看本步记录再下结论；冻结收割
      # 毁日志时 summary 同灭（BlobNotFound 家族），带日志的轮全部可回查。
      # 脚本 .github/scripts/dump-env.{ps1,sh}（Windows 战场 job 测试步前另有
      # brief 压力快照二次采样）。
      - name: Environment fingerprint
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure（2026-09-29 提速 P2）：红轮也保存编译缓存——否则连续修红
      # 时每轮全量重建（2026-09-29 三连红三烧全量的实证教训）。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Node.js (Vue 前端构建)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 与 daily-release 同一套系统依赖（plugin 相关；主二进制用 rustls 不依赖 OpenSSL）。
      # ubuntu-latest 镜像自带 libasound2-dev 等，缺的这里是超集补齐。
      - name: Install Linux system deps (GTK / webkit2gtk / appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build Vue frontend (include_dir! 前置，见文件头注释)
        shell: bash
        run: |
          cd web
          npm ci
          # 防御性清旧 hashed chunk（emptyOutDir:true 已自清，此行兜底 config 翻转）
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # H5 fmt 基线已落地（2026-09-02），格式偏差在此阻塞；规则见 .rustfmt.toml
      - name: cargo fmt --check（阻塞门禁）
        run: cargo fmt --all --check

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

      # 功能清单同步闸（features.toml ↔ nemesisbot/Cargo.toml [features]；
      # 新增 Cargo feature 不登记清单 = 定制构建 TUI 勾不到 = 静默裁不掉，
      # 防再犯——channels-wecom 四通道漏登记同类事故的 CI 兜底）
      - name: Feature-manifest sync gate
        run: |
          cargo build -p nemesis-build-config
          target/debug/nemesis-build-config check

      # 内联测试防回归闸（四形态禁止；独立测试文件才合法）
      - name: Inline-tests discipline gate
        run: bash scripts/check-inline-tests.sh

      # 路径消毒纪律闸（SAN-05：路径成分派生禁裸 replace(':')，走
      # nemesis_utils::sanitize::sanitize_path_segment 单一真相源）
      - name: Sanitize-discipline gate
        run: bash scripts/check-sanitize-discipline.sh

      # provider 烘焙纪律闸（PB-1：白名单外禁新建 create_provider 装配点，
      # 长生命周期消费者走 default_following wrapper 随热切跟随）
      - name: Provider-bake discipline gate
        run: bash scripts/check-provider-bake.sh

      # 公开文档版本一致性闸（README Rust 版本 vs rust-toolchain.toml，
      # 防文档漂移——复评整改批次 A 加固项）
      - name: Doc version consistency gate
        run: bash scripts/check-doc-version.sh

      # H2 已清零（2026-08-31），此步为阻塞门禁；见文件头 clippy 门禁说明
      - name: cargo clippy -D warnings（阻塞门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 跨平台冒烟：核心纯逻辑 crate 在 Linux 也必须绿（全量 Linux 测试在 extended-tests）
      - name: Linux cross-platform smoke tests
        run: cargo test -p nemesis-types -p nemesis-config -p nemesis-bus

      # 架构依赖矩阵门禁（扩展计划 T3/D7：分层规则 R1-R7 违规即红，
      # 防依赖倒流/越层直依赖——纯 cargo metadata 读图，秒级）
      - name: Architecture dependency gate
        run: cargo test -p arch-gate

  coverage:
    name: Line coverage floor (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # 扩展计划 T7a/D6（docs/INFO/2026-09-24_公开基准.md §5）：行覆盖硬地板，
      # 防倒退不追高。基线口径：全 workspace lib（nemesis-config 除外——
      # llvm-cov 独立 target-dir 环境特定失败；test-harness / nemesis-build-config
      # 为测试基建 lib 非产品代码，一并排除），见 docs/INFO/2026-06-27_coverage-baseline.md。
      # Windows 本机 2026-09-25 实测 87.85%。当前种子 84 吸收 Linux/Windows
      # 平台差（Linux 缺 Windows 形态测试）；CI 首跑实测后按「实测-2」上调
      # 固定，此后只升不降——上调须附同口径实测数字，防止「改基线凑门槛」。
      COVERAGE_FLOOR_LINES: "84"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 环境指纹（设备归因，见 rust-check 同名步骤注释）
      - name: Environment fingerprint
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Install Rust toolchain + llvm-tools (coverage 采集前置)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # cache-on-failure（2026-09-29 提速 P2，同 rust-check job 注释）
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # prebuilt 二进制直装（秒级）；cargo install 源码编译每轮白烧 3-5min
      # （2026-09-29 提速 P4）
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Setup Node.js (Vue 前端构建，include_dir! 前置)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps (GTK / webkit2gtk / appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build Vue frontend
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # --fail-under-lines：行覆盖低于地板即红（防倒退）。首次合入时以此
      # CI 平台实测为准校准 env 数字（Windows 本机实测会略高——Windows
      # 形态测试在 Linux 不跑）。
      # ulimit -n：workspace lib 套件（nemesis-web 二三千个 #[tokio::test]
      # 同进程跑）fd 累积峰值超 Linux 默认 soft 1024 → EMFILE 级联假红
      # （Failed building the Runtime: Too many open files）；Windows 无
      # 此概念。提到 65535（远低于 runner hard 上限）。
      - name: Measure coverage and enforce floor
        run: ulimit -n 65535; cargo llvm-cov --workspace --lib --exclude nemesis-config --exclude test-harness --exclude nemesis-build-config --summary-only --fail-under-lines "$COVERAGE_FLOOR_LINES"

      # T7b（扩展计划 D6）：生产/测试行数比——CI 汇总打印，数值随仓库
      # 演进浮动，不设门槛（叙事指标非门禁）。
      - name: Test-to-production line ratio summary
        run: |
          bash scripts/test-ratio.sh --quiet
          cat target/test-ratio.txt

  # windows-bin（2026-10-26）：bin 构建单点化。当天实录：bin 链接步 6 死 4 过
  # （40327245340 shard2 三连死；40336546888 三片卡 44min+；40345195179 两片卡
  # 37min+），健康机 3-7min 即过——同 commit 同缓存，方差全在 VM 抽签。每片
  # 各自 build -p nemesisbot = 每 run 抽 4 张同一张死亡彩票。改为独立 job 只建
  # 一次 exe、artifact 下发四片：彩票 4→1；且分片 job 龄从 bin 完成起算
  # （等 bin 不算分片 runner 龄），测试段远离 ~45min 失联窗。分片仍保留 libs
  # 步（测试目标编译要 lib 产物）；exe 钉位 target/debug/nemesisbot.exe。
  windows-bin:
    name: Build nemesisbot.exe (Windows, 单点)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # 与 rust-test 同 shared-key（win-x64-r10）：bin job 建成即存（失败轮也存，
      # cache-on-failure），后续 run 大概率缓存命中走快路径
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: win-x64-r10
          workspaces: |
            .
            plugins/wasm/translate
            plugins/wasm/activity-log
            plugins/wasm/textstat
            plugins/wasm/policy-sample

      - name: Exclude target dir from Defender scan
        shell: powershell
        run: Set-MpPreference -ExclusionPath "${{ github.workspace }}\target"

      - name: Setup Node.js (Vue 前端构建)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # MaxMinutes 30（2026-10-26 晚 45→30）：健康半冷 bin 构建 ~15min，45 上限
      # 在劣化 VM 上永远轮不到执行——首批 run 实录 bin job 僵尸 59min（看门狗
      # sleep 循环被爬死，45min 熔断与 ~50min runner 回收双双迟到，已编产物
      # 随 VM 蒸发，下一轮继续半冷）。收 30 = 楔死时 VM 尚有余力执行软着陆
      # 树杀 + 存缓存（cache-on-failure），下一轮吃暖缓存快路径。30 仍给
      # 半冷构建 ~2 倍裕量，不误杀合法慢跑。
      - name: Build nemesisbot bin (watchdog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag binjob -MaxMinutes 30 -BuildCommand "cargo build -p nemesisbot"

      - name: Upload nemesisbot.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemesisbot-windows-exe
          path: target/debug/nemesisbot.exe
          if-no-files-found: error
          retention-days: 3

  rust-test:
    name: Rust full workspace tests (Windows, shard ${{ matrix.shard }})
    needs: windows-bin
    # 2026-10-08 pin windows-2022：win25（windows-latest 当前指向）20261004 镜像
    # （10-07 发布滚动铺开）落地后本 job 编译期 runner 六连死失联（挂点恒定
    # 51-55min，与并发/调试信息/增量全部缓解措施无关，看门狗也未能软着陆）——
    # 资源压力解释不了时间恒定性，矛头指向镜像波次自身。该波次 OS build 未变
    # （26100.33438 两版一致），但应用层含 WSL 2.7→3.0 大版本跳跃等系统级变更。
    # win22（20261004.326，10-05 波次）无 WSL 升级且 OS 代际不同（20348），作
    # 单变量对照：绿=坐实 win25 20261004 镜像问题（等上游修复再评估回迁），
    # 红=排除镜像、回头排查 Cargo.lock（wasmtime 家族升级）。
    #
    # 分片（2026-10-10 第十六轮）：战役 R14 实证 Windows 全量套件执行在慢机族
    # 上 80-150min 且从未自然完赛（cap 83×3 / 冻死 111,150 / job timeout）——
    # 单段 150min 本身就是暴露面（撞自 cap、撞 ~50min 冻死窗口、撞 job timeout
    # 三头堵）。nextest hash 分片把套件稳定对半拆（--partition hash:N/2，按测试
    # 指纹哈希，两片并集=全集），单片墙钟减半滑出全部死亡窗口。两片各自过看门
    # 狗与 timeout；fail-fast=false 保一片红时另一片照跑（要全量体检报告）。
    #
    # 2→3 片（2026-10-10 深夜）：对半拆后单片仍偶发整机失联（实录 shard1 两连
    # 死，死亡时刻在构建步——VM 抽签劣化后处处爬行，谁在 45min 线上谁死，
    # 与步骤无关；shard2 同构建 25min 全绿）。三片把单片测试量再减半，
    # 典型总墙钟 ~20-22min，深滑出失联窗；构建步的 VM 抽签劣化无法结构性
    # 消除（rerun-failed-jobs 仍是对策，官方口径同）。三片并集=全集不变。
    #
    # 3→4 片（2026-10-26）：shard2 三连死（死亡时刻 51/53/52min，全卡在 bin
    # 构建步、前置步骤全程常速=VM 抽签劣化复发；健康机 shard1/3 总墙钟
    # 37-39min 已贴窗沿）。套件自 10-10 起又长大（nextest 实测 29.6min/片），
    # 三片制典型总墙钟从 ~20-22min 涨回窗内。四片把单片测试再减
    # （~22min），典型总墙钟 ~28min，重新留出 ~18min 余量。四片并集=全集。
    #
    # bin 单点化（2026-10-26 晚）：四片制首两 run 仍见 bin 链接步 5 死（健康
    # 机 3-7min 即过，同 commit 同缓存=纯 VM 抽签）——每片各自 build
    # -p nemesisbot 等于每 run 抽 4 张同一张死亡彩票。改为独立 windows-bin
    # job 只建一次 exe、artifact 下发：彩票 4→1；本 job needs 之，job 龄从
    # bin 完成起算，测试段远离 ~45min 失联窗。bin 步从本 job 移除，exe 由
    # download-artifact 钉位 target/debug/nemesisbot.exe（live 批 spawn 路径）。
    #
    # 4→6 片（2026-10-26 深夜）：单点化后首 run 四片三死一残，死亡时刻全部
    # 落在自家 job 龄 48-55min（libs/nextest 各有，日志全 404=runner 冻结），
    # 且全天铁律=成功者全部 <40min 完赛、死亡者全部 45-55min——冻结跟墙钟
    # 年龄走不跟步骤走。暖路径分片总时长 ~41min 贴线（setup 4 + libs 3 +
    # frontend 2 + nextest 编译 ~10 + 执行 ~22），必须压回线下。6 片把执行段
    # 22→~15min，暖路径 ~34min，留 ~10min 余量。编译段（按测试二进制整体
    # 编）不随片数收缩，是新的下界。六片并集=全集。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2022
    # 90→120（2026-10-08）：编译三杠杆（JOBS:2 + 无增量）换内存余量，编译变慢，
    # 给冷构建留够预算（120 是 ET 同款 job 的既有额度）。
    # 120→180（2026-10-10 第十五轮）：nextest 上限 85→115 后，慢机族总墙钟
    # （libs 10 + bin 5 + nextest ~100 + 缓存保存 ~5）可达 ~120min——job 级
    # timeout 必须盖过步级上限之和，否则 job timeout 先杀、软着陆缓存保存白费。
    timeout-minutes: 180
    env:
      # 2026-10-08~09 编译期 runner 失联战役（十连死全记录见 docs 报告 §六~§十）：
      # 冷编 nemesisbot bin 步内 runner 硬死（"hosted runner lost communication"，
      # 46-55min 恒定窗口，日志 BlobNotFound）。十轮排除法已证与下列全部无关：
      # debuginfo 三档 / JOBS 4-3-2 / 增量开关 / win25+win22 双镜像 / Cargo.lock
      # 铡锁对照（wasmtime 48.0.5↔48.0.3 同死，R5）。矛头指向车队侧慢性失联
      # （官方口径即重试）。剩余可用杠杆 = 墙钟压缩滑出死亡窗口：
      #   - 保 CARGO_INCREMENTAL=0（CI 惯例）；debuginfo 走根 Cargo.toml 的
      #     line-tables-only；
      #   - bin 构建拆两段（库段 → bin 段）看门狗包装：单步墙钟减半，仍失联时
      #     两段时间线直接点名触发面（库段 vs 最终链接）。
      # JOBS 收 3（2026-10-22）：失联战役期 JOBS 4-3-2 实验针对的是连接死亡
      # （无效，当时回默认 4）；shard3 实录第二模式——看门狗实测
      # free_commit=1958MB 跌破 2048 地板（t=5min 编译期、零测试执行、
      # Cargo.lock 变更触发依赖层全量重编、-j4 并行 rustc 承诺峰值超限、
      # 同 commit 换机 att2 即绿 = 对 runner 方差敏感）。收 3 削 ~一个 rustc
      # 的并行承诺峰值（约 2-4GB），编译 +3-5min 对 115min 预算可忽略；
      # 进程级归因（谁在吃、吃多少）看 build-with-watchdog.ps1 的
      # WARN/ABORT top-mem 快照。
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 环境指纹（设备归因，见 rust-check 同名步骤注释）——Windows 分片版
      - name: Environment fingerprint (Windows shard ${{ matrix.shard }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\dump-env.ps1"

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable
        # wasm32-wasip2：nemesis-plugins-wasm 的对抗/e2e/sdk 测试在运行时真
        # 构建示例 wasm 组件做 fixture——无此 target = fixture 构建失败 =
        # 诚实 SKIP = 16 个安全测试在 CI 空转（2026-09-30 插件体系复查）。
        with:
          targets: wasm32-wasip2

      # cache-on-failure（2026-09-29 提速 P2，同 rust-check job 注释）
      # workspaces 收编三个示例插件（嵌套独立 workspace）：fixture 构建产物
      # 落在各自 target/，不收编则每轮冷构建多花 3-6 分钟。
      # shared-key win-x64-r10（2026-10-09 第十轮，取代 R7 的 key: r7）：
      # r7 命名空间从未成功保存过——runner 失联时 Post 步骤不执行，CI 十轮
      # 全冷；而冷构建的 bin 步（最终链接）是全流程内存峰值，R9 实证 libs
      # 6.6min 健康跑完、bin 段 44min 后整机 paging 冻僵（看门狗 30min 上限
      # 都没触发），runner 在 job 龄 52min 被回收。ET integration-windows 用
      # 自家热缓存时同命令 2.8min（exe 已在缓存里，链接根本不执行）。本 job
      # 与 ET 同为 windows-2022 + 同一 Cargo.lock + 同 CARGO_INCREMENTAL=0，
      # shared-key 让两 job 共享同一缓存命名空间：ET 构建成功即存（cache-
      # on-failure 失败轮也存），CI 恢复后 bin 步变 no-op，结构性绕开冷链接
      # 死亡面。首次引导需一轮冷（先 ET 存、CI rerun 后吃热）。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: win-x64-r10
          workspaces: |
            .
            plugins/wasm/translate
            plugins/wasm/activity-log
            plugins/wasm/textstat
            plugins/wasm/policy-sample

      # Defender 实时扫描排除 target 目录（2026-09-29 提速 P4）：编译期海量
      # 临时文件逐个过扫描典型拖慢 5-15%；runner 是一次性机器，无安全顾虑
      - name: Exclude target dir from Defender scan
        shell: powershell
        run: Set-MpPreference -ExclusionPath "${{ github.workspace }}\target"

      # nextest prebuilt 直装（秒级，2026-09-29 提速 P3）
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Setup Node.js (Vue 前端构建)
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash              # Windows 下 rm -rf 需要 bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # 【历史事故记录 2026-09-01/09-02 三连崩 → 已恢复全量】cpal 0.15 WASAPI
      # 后端在 GitHub runner 虚拟音频栈上会 native ACCESS_VIOLATION（0xc0000005）
      # 秒杀测试进程：①voice 播放流 → ②voice 设备枚举 → ③web 穿透调用
      # （cmd_devices → nemesis_voice::audio::list_devices，同进程首次枚举正常、
      # 二次挂死）。排查确认全部雷点后已恢复 --workspace 全量，防线改为测试内
      # CI=true 双保险 SKIP 闸（凡触碰 cpal 的测试：voice 8 个 + web 穿透 2 个，
      # 设 NEMESISBOT_VOICE_HW_TESTS=1 可在 CI opt-in）。
      # ⚠️ 新增触碰 cpal/音频设备的测试必须挂同款闸，否则 CI 必崩。
      #
      # 同族警示（2026-10-10）：estop→ConPTY kill 路径在 hosted windows
      # runner 上四连楔死（100min+ 挂死/120s TIMEOUT×2/110s 看门狗 abort，
      # 本机不复现；优雅 close 的 roundtrip/401 不受影响）——
      # pty::tests::estop_engage_kills_session 挂同款 CI 闸（Windows CI
      # 默认 SKIP，NEMESISBOT_PTY_ESTOP_TESTS=1 opt-in；Linux CI 照跑）。
      # 新增走 ConPTY kill 的测试须挂同款闸。
      #
      # nextest（2026-09-29 提速 P3）：① 测试二进制并行执行；② .config/nextest.toml
      # 把真 gateway live 批（commands::gateway::{r9_live_tests,scenario_tests}，
      # 固定端口 8080/49000/18790，原 live_gate() 互斥闸只在单进程内生效）钉进
      # max-threads=1 组保串行。两个行为差异（本地验证实证，勿回退）：
      #   a. nextest 只构建测试二进制、不构建常规 bin 目标——live 批夹具要 spawn
      #      target/debug/nemesisbot.exe，exe 由 windows-bin job 构建经 artifact
      #      下发（2026-10-26 bin 单点化，本 job 不再自建）；
      #   b. nextest ≥0.9.1xx 默认 fail-fast（一处红取消剩余），与本 job 全量
      #      体检语义相反——必须显式 --no-fail-fast。
      # nextest 不跑 doctests（本仓库无实质 doctest 断言，无覆盖损失）。
      # 构建拆两段（2026-10-09 第六轮，见 env 块注释）：库段编 workspace 其余
      # 全部（顺带 integration-test 等工具 bin），bin 段只链最终 exe。
      - name: Build workspace libs (watchdog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag cibuild1 -MaxMinutes 60 -BuildCommand "cargo build --workspace --exclude nemesisbot"

      # bin 单点化（2026-10-26）：exe 由 windows-bin job 构建经 artifact 下发，
      # 本 job 不再自建（死亡彩票 4→1）。先清缓存恢复出的旧 exe 再落位，避免
      # 旧 commit 的 exe 残留（缓存键只含 Cargo.lock 哈希，不含源码哈希）。
      - name: Clear stale exe (缓存旧 exe 让位本 run artifact)
        shell: powershell
        run: if (Test-Path "target/debug/nemesisbot.exe") { Remove-Item -Force "target/debug/nemesisbot.exe" }

      - name: Download prebuilt nemesisbot.exe
        uses: actions/download-artifact@v4
        with:
          name: nemesisbot-windows-exe
          path: target/debug

      - name: Verify downloaded exe
        shell: powershell
        run: |
          $p = "target/debug/nemesisbot.exe"
          if (-not (Test-Path $p)) { Write-Error "nemesisbot.exe missing after artifact download"; exit 1 }
          Get-Item $p | Format-Table Name, Length -AutoSize

      # 测试执行前压力快照（brief 模式，见 rust-check 环境指纹注释）：构建刚跑完，
      # 此时余内存/commit/CPU 负载是 nextest 的真实起点——慢机/冻结归因的第二采样点
      - name: Pre-test pressure snapshot (shard ${{ matrix.shard }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\dump-env.ps1" brief

      - name: cargo nextest run --workspace (watchdog, shard ${{ matrix.shard }})
        # nextest 步前半段同样是全量测试目标编译（六连死的同源风险面），
        # 同款看门狗包装；尾部行数放大——失败摘要必须在 tail 里可见。
        # MaxMinutes 85（第四轮 75→85）：JOBS:2 + 冷缓存下测试目标编译 ~25-30min
        # + 全量 21k 测试执行，75min 实测被自己的上限树杀（win22 首轮败因，
        # 非 runner 失联——资源曲线全程平稳即证据）。
        # MaxMinutes 115（2026-10-10 第十五轮 85→115）：慢机族实测三连杀（a6/a7/a8
        # 全在 RUN83min 撞 85 上限软着陆，套件全程有进展、VM 全程响应——不是
        # 失联，是我们自己的上限比慢机套件墙钟短）。看门狗的天职是软着陆保缓存，
        # 不是掐死合法慢跑；115 给慢机 ~30min 余量（套件慢机墙钟 ~90-100min），
        # 健康机 30-40min 完成不受影响。job timeout 同步 120→180 兜底。
        # --partition hash:N/2（2026-10-10 第十六轮）：整段拆半——单片=半集测试，
        # 编译共享（同缓存恢复）执行减半，慢机族 80-150min 的未完赛段从此
        # ~40-75min 收口。job 级 timeout 维持 180（两片并行，总墙钟不变）。
        # hash:N/3（2026-10-10 深夜 2→3 片）：对半拆后单片仍偶发失联（shard1
        # 两连死，死在构建步=VM 抽签劣化与步骤无关），三片把单片测试再减半，
        # 典型总墙钟 ~20-22min 深滑出失联窗。三片并集=全集。
        # hash:N/4（2026-10-26 3→4 片）：shard2 三连死（51/53/52min，全卡 bin
        # 构建步、前置常速=抽签劣化复发），套件增长令三片总墙钟重回窗内；
        # 四片单片测试 ~22min、典型总墙钟 ~28min。四片并集=全集。
        # hash:N/6（2026-10-26 深夜 4→6 片）：单点化后首 run 四片三死一残，死亡
        # 时刻全在自家 job 龄 48-55min（libs/nextest 各有，日志 404=runner 冻结），
        # 铁律=成功 <40min / 死亡 45-55min（冻结跟墙钟年龄走不跟步骤走）。
        # 暖路径 41min 贴线必须压回：执行段 22→~15min、暖路径 ~34min。
        # 编译段按测试二进制整体编、不随片数收缩，是新的下界。六片并集=全集。
        # --failure-output final（2026-10-18）：失败详情只进收尾 recap——默认
        # immediate 在中段流打 panic 现场，wrapper 只留 stderr 尾 100 行=现场
        # 结构性丢失（sup_env 两连红实录：失败在 7959/9139 位，panic 文本永不
        # 入日志）。final 把详情挪进 Summary 前的 recap（必然落在尾窗）。
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag "nextest-s${{ matrix.shard }}" -MaxMinutes 115 -TailOut 200 -TailErr 100 -BuildCommand "cargo nextest run --workspace --no-fail-fast --failure-output final --partition hash:${{ matrix.shard }}/6"

  frontend:
    name: Frontend typecheck + vitest + build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 皮肤 vitest 断言读 skins/bot/skin/structure.html 等骨架文件——只显式
      # 拉 skins（不能用 submodules: recursive，会连 docs 私有仓库一起拉，
      # runner 的 GITHUB_TOKEN 无权限 → Repository not found，daily-release
      # 2026-09-27 首跑实证）。⚠️ 本 job 全局 working-directory: web，
      # submodule 命令必须显式回仓库根，否则 pathspec 'skins' 不存在。
      - name: Checkout skins submodule
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth 1 skins

      # 环境指纹（设备归因，见 rust-check 同名步骤注释）；
      # 本 job defaults.run.working-directory=web，此步显式回仓库根
      - name: Environment fingerprint
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci，lockfile 入库后可复现)
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

  web-e2e:
    # Web 端到端回归（Playwright + TestAIServer 同族 mock LLM + 本地 gateway 全链路）。
    # 11 个自足 spec：auth / chat / approval / board / board-ui / model-switch / resync /
    # disconnect-recovery / project-history / workflow-diff / workflow-gen（迁移自
    # scripts/verify-*.mjs 手工脚本；board-ui=看板页面 DOM 路径、disconnect-recovery=
    # 断线恢复（整改复核 §四.3 补覆盖））。
    #
    # ⚠️ 观察期 job（continue-on-error：红不阻塞 CI）：首期观察真实性/稳定性
    # （runner 音频/浏览器/端口环境差异）。摘除条件（写死）：自本批起**连续 10
    # 轮 CI 全绿**且上述 11 个 spec 全部在场（spec 数缩水不算达成）——两条件
    # 同时满足才摘 continue-on-error 翻红。失败现场：test-results/ +
    # playwright-report/ artifact always() 上传。
    name: Web e2e (Playwright, 观察期)
    runs-on: windows-2022
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Environment fingerprint
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Install Rust toolchain (rust-toolchain.toml 钉 stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # 前端必须先于 cargo build：nemesisbot 经 include_dir! 嵌入 static/，
      # e2e 测的是当前 UI（编译期嵌入，运行期 exe 旁无 static/ 目录）
      - name: Build Vue frontend (include_dir! 前置)
        shell: bash
        run: |
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # e2e 夹具 spawn target/debug/nemesisbot.exe（E2E.bin 解析序 release→debug）
      - name: Build nemesisbot (debug, embeds fresh static)
        run: cargo build -p nemesisbot

      - name: Install Playwright chromium
        run: npx playwright install chromium

      # e2e/ 不在 tsconfig.json include 内（vue-tsc 只查 src/**），Playwright 的
      # esbuild 转译剥类型不报错——类型门禁单独跑（supervisor ReferenceError 实录）。
      - name: Typecheck e2e suite
        run: npx tsc --noEmit -p tsconfig.e2e.json

      - name: Run e2e suite
        run: npx playwright test

      - name: Upload e2e failure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
