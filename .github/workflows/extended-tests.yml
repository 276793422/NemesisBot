name: Extended Tests

# H1 扩展测试（project-health v2 §H1，docs/PLAN/2026-08-31_project-health-improvement-v2.md）
#
# 职责：nightly 深度验证——CI（ci.yml）管每次 push/PR 的快速门禁，这里管三件
# CI 不放的事：
#   1. Linux 全量 workspace 测试（ci.yml 的 Windows 全量之外的跨平台长期验证；
#      首次上 Linux 可能暴露平台性失败，红了按 bug 修——这正是它的价值）；
#   2. feature 裁剪矩阵抽查：default / minimal-iot / desktop 三构建配置
#      （对应 scripts/customize/profiles/，裁剪完度回归，防 feature 泄漏编译坏）；
#   3. 集成测试工具：integration-test（492 断言 CLI）+ cluster-uat（T1-T48 主链
#      + T-XFER/T-MRG/T-CONN/T-MONITOR + U 职能系列，70+ 场景 E2E）。
#      这两个是纯 bin runner（须 cargo run，不是 cargo test——Cargo.toml 只有
#      [[bin]] 没有 [[test]]），依赖 test-harness 拉起真实 gateway + TestAIServer。
#      test-harness 的二进制解析硬编码 Windows 形态（target/debug/nemesisbot.exe、
#      testaiserver.exe、taskkill 清端口），所以放 windows-latest 跑（今天的事实）。
#
# 与 daily-release 的关系：daily-release 已改为 workflow_run 由本工作流【成功】
# 触发——发布不再绕过验证。本工作流失败 = 当天没有 nightly，这是设计行为。
#
# fmt 门禁不在本文件（H5 fmt 基线落地后再评估放 CI 还是 extended）。

on:
  schedule:
    # 每天 UTC 1:00（北京时间 9:00）。成功后经 workflow_run 触发 daily-release。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      seed_cache:
        description: 只构建并落共享缓存（win-x64-r10 引导用）；测试全跳过，run 故意红以拦 nightly
        type: boolean
        default: false

permissions:
  contents: read
  # upload-artifact@v4（失败轮证据归档，2026-10-10）需要 actions:write。
  actions: write

concurrency:
  group: extended-tests
  cancel-in-progress: false     # nightly 不互相掐（超时由 timeout-minutes 兜底）

jobs:
  workspace-tests-linux:
    # seed_cache=true 引导轮：job 名带醒目 SEED 标注——该轮故意红（见文件尾
    # Seed-run marker），红脸在 Actions 页一眼可辨是引导不是故障（2026-10-12
    # 实录：seed 轮红灯被误读为 ET 出错）。非 dispatch 触发时 inputs 为空，后缀为空串。
    name: Full workspace tests (Linux)${{ inputs.seed_cache == true && ' 【SEED·仅构建落缓存·不跑测试·故意红】' || '' }}
    # seed_cache 引导轮只构建落缓存，测试 job 全跳过（省 VM 时长）
    if: ${{ inputs.seed_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 平台环境指纹（2026-10-12 设备归因纪律，所有测试 job 前置；十个检测域
      # 与探针设计详见 ci.yml rust-check 同名步骤注释；脚本
      # .github/scripts/dump-env.{ps1,sh}）
      - name: Environment fingerprint
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # wasm32-wasip2：nemesis-plugins-wasm 的对抗/e2e/sdk 测试在运行时真
        # 构建示例 wasm 组件做 fixture——无此 target = 诚实 SKIP 空转（同
        # ci.yml Windows 全量 job，2026-09-30 插件体系复查）。
        with:
          targets: wasm32-wasip2

      # workspaces 收编三个示例插件（嵌套独立 workspace）：fixture 构建产物
      # 落在各自 target/，不收编则每轮冷构建多花 3-6 分钟。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            plugins/wasm/translate
            plugins/wasm/activity-log
            plugins/wasm/textstat

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      - name: cargo test --workspace
        # 雷区 11（2026-09-01 nemesis_web 实录）：GH ubuntu runner 默认
        # ulimit -n 1024，fd 表进程级终生持有——nemesis_web 全量跑到 ~400
        # 个后耗尽，后续上千个连坐 panic（Os error 24）。跑前抬高，不改代码。
        # --no-fail-fast（2026-09-02 bwrap 实录）：cargo 默认一个测试二进制
        # 失败就中止整个 workspace 跑——nemesis-sandbox 一红，后面
        # security..nemesisbot 约 2000 个测试全没跑。nightly 要的是全量
        # 体检报告，一轮把所有红都暴露出来，不在半路掐断。
        # 平台形态标记约定（2026-09-02 起，替代旧的 --exclude nemesisbot）：
        # Windows 形态的 CLI 测试（.exe 硬编码 / taskkill / ComSpec 等
        # 进程边界假设）在测试 fn 上挂 `#[cfg(windows)]`——Linux 上编译期
        # 消失而非运行期跳过（清单对账干净，不产生假 pass）。首迁移 285 个
        # （雷区 21 家族，模块粒度不可行：29 个失败模块里 28 个混合，
        # 1,386 个 Linux 绿测试会被陪葬）。新增此类测试不挂标记会在本
        # job 红出来——有兜底，不静默。
        run: |
          ulimit -n 8192
          cargo test --workspace --no-fail-fast

  feature-matrix:
    name: Feature trimming matrix (Linux)${{ inputs.seed_cache == true && ' 【SEED·仅构建落缓存·不跑测试·故意红】' || '' }}
    if: ${{ inputs.seed_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            # 全量默认 feature
            flags: ''
          - name: minimal-iot
            # scripts/customize/profiles/minimal-iot.config 的 [features] 开关集
            flags: --no-default-features --features channels-web,channels-rpc
          - name: desktop
            # scripts/customize/profiles/desktop.config 的 [features] 开关集
            flags: --no-default-features --features channels-web,channels-webhook,channels-rpc,migrate,devices,desktop,health,heartbeat,auth,voice,cluster,forge,memory,workflow,security
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 环境指纹（设备归因，见 workspace-tests-linux 同名步骤注释）
      - name: Environment fingerprint (feature ${{ matrix.name }})
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-env.sh"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure（2026-09-29 提速 P2，见 ci.yml 同名注释）；三档 feature
      # 集差异大，分开缓存 key 避免互相踢
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: feature-matrix-${{ matrix.name }}
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # 编译级抽查（check 足以验证 feature 组合可编译；test 留给全量档）
      - name: cargo check -p nemesisbot ${{ matrix.name }}
        run: cargo check -p nemesisbot ${{ matrix.flags }}

  integration-windows:
    name: Integration + cluster UAT (Windows, ${{ matrix.segment.name }})${{ inputs.seed_cache == true && ' 【SEED·仅构建落缓存·不跑测试·故意红】' || '' }}
    # 切段独立 job（2026-10-10）：单 job 整套 cluster-uat（T1-T37 +
    # T-XFER×6 + T-MRG×7，成功轮 32min）连续两轮在 ~45:40±1s 处 runner
    # 暴死（GitHub 注解 = hosted runner lost communication；integration-test
    # 两轮都 ~50s 证明 VM 速度没退化，套件是卡在某个测试上+runner 暴死的
    # 叠加事件；日志随 runner 蒸发 BlobNotFound 无法定位死点）。切段后每段
    # VM 暴露 ≤ 半小时远短于 45min 死亡线；段死不连坐（rerun-failed-jobs
    # 只重跑死段）；卡死在段内 = 120min job 超时而非 runner 暴死 = 日志
    # 正常上传，悬案变带日志的红。Passed 行数 floor 守卫防切段参数 typo
    # 退化成 0 测试假绿。
    #
    # mrg 再切两段（2026-10-10 晚）：mrg 段三连死于 runner 回收线
    # （45:40 级/53min/48min，全 BlobNotFound 零次跑完），同构建链的 core
    # 段（37 测试）rerun 34min 绿、xfer 两连绿——定位不是构建也不是个别
    # 测试挂死，而是 T-MRG 族本体是 sweep/重派等待主导（本地 10.5min，
    # CI 26min+ 仍未完 ≈2.5x 墙钟缩放），7 测试总时长 47-51min 必然横跨
    # 回收线。切 3+4 后每段测试墙钟减半，总时长 32-39min 滑出死亡线。
    #
    # mrg-b 切四个单测试段（2026-10-11）：b1(T-MRG-4,5)/b2(T-MRG-6,7) 两段
    # 式连续两轮四连死在 52-54min 整机失联（BlobNotFound），同轮 core/xfer/
    # mrg-a 全绿——两测试段的段期望墙钟（build 8 + 桩切换重启 3 + 2x测试
    # 墙钟 ≈ 26min CI 缩放）落在失联窗内。注（机理修正，2026-10-11 终局模型）：
    # 死亡=平台冻结彩票（整机冻结、任意 phase、与负载/时长无关——同 commit
    # 13 绿 vs 3 冻同轮并存），切段【不降】冻结概率，真实价值=失败半径缩小
    # （绿段保留、rerun 只重跑死段）。切四后每段 ≈ build 3-8 + 桩 3 + 单
    # 测试 ≤10 ≈ 16-21min。配套：T-MRG-5/7 补桩
    # 自持块（原经 T-MRG-4/6 同进程共享的桩态在单测试段独立进程里不再
    # 存在；同值切换幂等）。min_pass=1 防切段参数 typo 退化 0 测试假绿。
    strategy:
      fail-fast: false
      matrix:
        segment:
          - name: core
            uat_args: "--exclude T-XFER --exclude T-MRG"
            min_pass: 37
          - name: xfer
            uat_args: "--filter T-XFER"
            min_pass: 6
          - name: mrg-a
            uat_args: "--filter T-MRG --exclude T-MRG-4 --exclude T-MRG-5 --exclude T-MRG-6 --exclude T-MRG-7"
            min_pass: 3
          - name: mrg-b1
            uat_args: "--filter T-MRG --exclude T-MRG-1 --exclude T-MRG-2 --exclude T-MRG-3 --exclude T-MRG-5 --exclude T-MRG-6 --exclude T-MRG-7"
            min_pass: 1
          - name: mrg-b2
            uat_args: "--filter T-MRG --exclude T-MRG-1 --exclude T-MRG-2 --exclude T-MRG-3 --exclude T-MRG-4 --exclude T-MRG-6 --exclude T-MRG-7"
            min_pass: 1
          - name: mrg-b3
            uat_args: "--filter T-MRG --exclude T-MRG-1 --exclude T-MRG-2 --exclude T-MRG-3 --exclude T-MRG-4 --exclude T-MRG-5 --exclude T-MRG-7"
            min_pass: 1
          - name: mrg-b4
            uat_args: "--filter T-MRG --exclude T-MRG-1 --exclude T-MRG-2 --exclude T-MRG-3 --exclude T-MRG-4 --exclude T-MRG-5 --exclude T-MRG-6"
            min_pass: 1
    # pin windows-2022：同 ci.yml rust-test——win25 20261004 镜像波次后编译期
    # runner 六连死失联，与全部资源缓解措施无关；win22 无该波次嫌疑变更
    # （WSL 停 2.x、OS 代际不同），作单变量对照实验。
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # 编译期 runner 失联战役（同 ci.yml rust-test 完整注释，docs 报告 §六~§十）：
      # 十连死排除法后仅剩墙钟压缩可用——保 CARGO_INCREMENTAL=0，构建拆两段
      # （库段 → bin 段）看门狗包装。JOBS 收 3（2026-10-22，同 ci.yml rust-test
      # 同步）：CI shard3 实录资源地板模式（free_commit 跌破 2048、-j4 并行
      # rustc 承诺峰值超限、Cargo.lock 变更期更甚）；编译面同源同收紧，
      # +3-5min 对 60/30min 步级预算可忽略。
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 环境指纹（设备归因，见 workspace-tests-linux 同名步骤注释）——本 job
      # 是冻结/失联主战场，七个切段每段一份完整指纹
      - name: Environment fingerprint (segment ${{ matrix.segment.name }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\dump-env.ps1"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure（2026-09-29 提速 P2，见 ci.yml 同名注释）。
      # shared-key win-x64-r10（2026-10-09 第十轮，与 ci.yml rust-test 共享）：
      # 本 job 的构建产物（含 nemesisbot.exe）由 ET 构建成功落缓存，CI 恢复
      # 后 bin 步变 no-op——CI 冷构建的链接段是 runner 失联战役十轮的死亡面
      # （见 ci.yml rust-test 缓存步注释），共享命名空间结构性绕开。同镜像
      # windows-2022 + 同一 Cargo.lock + 同 CARGO_INCREMENTAL=0，缓存互通。
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: win-x64-r10

      # Defender 实时扫描排除 target 目录（2026-09-29 提速 P4，见 ci.yml 同名注释）
      - name: Exclude target dir from Defender scan
        shell: powershell
        run: Set-MpPreference -ExclusionPath "${{ github.workspace }}\target"

      - name: Setup Go (TestAIServer)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          # 显式声明模块缓存（v5 默认会开，这里写死防上游行为变化）。R12 实录：
          # 一台 VM 上 go build 拉 gin 依赖树（~30 包）楔死 40min（proxy.golang.org
          # 网络劣化抽签），同 SHA 另一台 VM 几十秒过——缓存命中后 go build 离线
          # 可完成，对下载网络免疫。
          cache: true
          cache-dependency-path: test-tools/TestAIServer/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend (include_dir! 前置)
        shell: bash
        run: |
          cd web
          npm ci
          rm -rf ../crates/nemesis-web/static/assets
          npm run build

      # test-harness::resolve_ai_server_bin() 找的就是这个路径/文件名
      - name: Build TestAIServer
        shell: bash
        run: cd test-tools/TestAIServer && go build -o testaiserver.exe

      # test-harness 解析 target/debug/nemesisbot.exe（Windows 形态，debug 即可）。
      # 构建拆两段（同 ci.yml，2026-10-09 第六轮）：库段 → bin 段，单步墙钟减半
      # 滑出死亡窗口 + 仍失联时两段时间线点名触发面。
      - name: Build workspace libs (watchdog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag etbuild1 -MaxMinutes 60 -BuildCommand "cargo build --workspace --exclude nemesisbot"

      - name: Build nemesisbot (debug, watchdog)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\build-with-watchdog.ps1" -Tag etbuild2 -MaxMinutes 30 -BuildCommand "cargo build -p nemesisbot"

      # 纯 bin runner：cargo run（不是 cargo test——见文件头注释）。
      # tee 留全量输出进 step 日志；Passed floor 守卫防切段参数 typo 退化
      # 成 0 测试假绿（--filter/--exclude 都是子串匹配，拼错=全 SKIP）。
      # 测试执行前压力快照（brief 模式，见 ci.yml rust-check 环境指纹注释）：
      # 构建刚跑完，此时余内存/commit/CPU 负载是测试的真实起点——慢机/冻结归因
      # 的第二采样点（cluster-uat 段起步基线）
      - name: Pre-test pressure snapshot (segment ${{ matrix.segment.name }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\.github\scripts\dump-env.ps1" brief

      - name: Run integration-test (492 assertions, 22 commands)
        if: ${{ inputs.seed_cache != true }}
        run: cargo run -p integration-test

      - name: Run cluster-uat (${{ matrix.segment.name }})
        if: ${{ inputs.seed_cache != true }}
        shell: bash
        run: |
          set -o pipefail
          cargo run -p cluster-uat -- ${{ matrix.segment.uat_args }} | tee uat-${{ matrix.segment.name }}.log
          n=$(grep -oE 'Passed: [0-9]+' uat-${{ matrix.segment.name }}.log | grep -oE '[0-9]+' | tail -1)
          echo "cluster-uat ${RUNNER_NAME:-} executed-passed: ${n:-0} (floor ${{ matrix.segment.min_pass }})"
          if [ -z "$n" ] || [ "$n" -lt ${{ matrix.segment.min_pass }} ]; then
            echo "::error::cluster-uat ${{ matrix.segment.name }} passed ${n:-0} < floor ${{ matrix.segment.min_pass }}（切段参数 typo 或套件未跑完，不许假绿）"
            exit 1
          fi

      # 失败轮证据归档（2026-10-10 mrg-b 双 54min 暴死、日志 BlobNotFound 的
      # 教训收尾）：cluster-uat-logs/（四节点 gateway 日志 + cluster 状态）与
      # tee 的逐测试输出都是 runner 回收后唯一能回查的现场。正常轮不上传
      # （省存储）；runner 暴死轮两者皆失（无法救）——真正的第一现场已由
      # cluster-uat 双墙钟预算保证提前落 stdout（预算触线 = 诚实终局）。
      - name: Upload cluster-uat evidence (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-uat-evidence-${{ matrix.segment.name }}
          path: |
            cluster-uat-logs/
            uat-${{ matrix.segment.name }}.log
          if-no-files-found: ignore
          retention-days: 7

      # seed_cache 引导轮终点：构建步全部完成后到这里故意红。cache-on-failure
      # 会在 Post 步骤照常落共享缓存（引导目的达成）；run 结论=失败则
      # daily-release 的 workflow_run 闸（只放行 success）不会误发未经验证的
      # nightly——红是诚实信号：本 run 没跑任何测试，不配放行发布。
      - name: Seed-run marker（故意失败拦 nightly，见注释）
        if: ${{ inputs.seed_cache == true }}
        run: |
          echo "seed_cache=true：本 run 只构建并落共享缓存 win-x64-r10，测试全部跳过。"
          echo "故意失败：拦住 daily-release（success 才放行），也如实告知本 run 未验证。"
          exit 1
