[package]
name = "nemesis-taiwei"
version = "0.0.0-stub"
edition = "2024"
license = "LicenseRef-Proprietary"
# 装配槽占位（stub）：本目录是商业装配槽（槽区 slots/ 下），装配发生在装配
# 复制体（assembly/，git 忽略）里——公开工作区永不覆盖本目录。开源构建只以
# 本 stub 满足 nemesisbot 对 optional path 依赖的解析（feature `taiwei` 关 =
# 本 crate 永不编译）；feature 开且未装配 = src/lib.rs 的 compile_error 诚实
# 拦下。装配复制体中本文件被实现 manifest 整体替换后按独立 manifest 编译——
# 本 crate 刻意不用 workspace 继承（version/deps 全显式），在「独立仓 workspace
# 成员」与「本仓 exclude 槽位」两种语境下语义一致。

[features]
# 宿主 feature `taiwei = ["dep:nemesis-taiwei", "nemesis-taiwei/geoloc-win"]`
# 转发本 feature——cargo 校验 feature 引用要求其存在于被引包 manifest（与
# 开关激活无关）。stub 态声明为空 no-op；装配复制体中被实现 manifest 的同名
# feature（Windows WinRT 定位后端）整体覆盖。
geoloc-win = []

[lints.rust]
# stub 形态检查（dead_code 等对占位无意义）
dead_code = "allow"
