[package]
name = "nemesisbot"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "nemesisbot"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Feature trimming — see docs/PLAN/2026-07-01_feature-trimming-and-build-configurator.md
# ---------------------------------------------------------------------------
# Channel backends are forwarded to nemesis-channels. Build a custom set with
#   cargo build -p nemesisbot --no-default-features \
#     --features "channels-web,channels-rpc,channels-telegram"
[features]
default = [
    "channels-web", "channels-webhook", "channels-rpc",
    "channels-websocket", "channels-external", "channels-maixcam", "channels-line",
    "migrate", "devices", "desktop", "health", "heartbeat", "auth", "voice", "voice-capture", "cluster",
    "forge", "memory", "workflow", "security", "scanner", "sandbox", "vm", "eval", "usage", "board",
    "connectors",
    "terminal", "skins", "plugins-wasm", "codemode", "selfupdate",
    "pricing-embed", "verify", "web-static", "lsp",
    "checkpoint-git", "image-process", "history-search", "usage-store",
]

# Optional subsystems (on by default = current full build; drop with --no-default-features)
migrate = ["dep:nemesis-migrate"]
devices = ["dep:nemesis-devices"]
desktop = ["dep:nemesis-desktop"]
health = ["dep:nemesis-health"]
heartbeat = ["dep:nemesis-heartbeat"]
auth = ["dep:nemesis-auth"]
# voice = 语音本体（STT/TTS/VAD/标点/声纹/云转写，缓冲区与文件驱动）；
# voice-capture = 设备 IO（麦克风采集/扬声器播放/AEC/loopback，cpal+wasapi）。
# capture 不隐含在 voice 里——IoT 可只留转写不带设备 IO；全量构建两者都开。
voice = ["dep:nemesis-voice", "nemesis-web/voice"]
voice-capture = ["voice", "nemesis-voice/voice-capture", "nemesis-web/voice-capture"]
cluster = ["dep:nemesis-cluster", "nemesis-web/cluster"]
# A1 iroh 跨网 P2P 叠加层：iroh 依赖随 nemesis-cluster 的 cluster-roaming 进出；
# CLI `cluster roaming` 子命令同 feature 门控。默认关——LAN 用户零新依赖。
cluster-roaming = ["cluster", "nemesis-cluster/cluster-roaming", "nemesis-web/cluster-roaming"]
forge = ["dep:nemesis-forge", "nemesis-agent/forge", "nemesis-web/forge"]
memory = ["dep:nemesis-memory", "nemesis-agent/memory", "nemesis-web/memory"]
workflow = ["dep:nemesis-workflow", "nemesis-agent/workflow", "nemesis-web/workflow"]
security = ["dep:nemesis-security", "nemesis-security/security", "nemesis-agent/security", "nemesis-web/security"]
# scanner：病毒扫描（第 7 层 + `nemesisbot scanner` CLI + Dashboard Scanner 页）。
# implies security（管线里第 7 层臂 + clamav + zip 随它进出）；关 = 第 7 层诚实短路。
scanner = ["security", "nemesis-security/scanner", "nemesis-web/scanner"]

# Sandboxie integration (executor.sandbox=true + `nemesisbot sandbox` install/use/uninstall).
# Optional — off in minimal-iot/IoT (Sandboxie is Windows-driver-based, not used on IoT).
sandbox = ["dep:nemesis-sandbox", "nemesis-web/sandbox"]
# P5 桌面级 VM 后端（executor.vm）：穿透 nemesis-sandbox/vm 模块 + Dashboard
# VM 页。关 = vm 模块整包不编译、executor.vm 配置缺消费者（诚实报未编译）。
# IoT/无虚拟化环境默认关（IoT 预设钉 false）。
vm = ["dep:nemesis-sandbox", "nemesis-sandbox/vm", "nemesis-web/vm"]
# Managed-agent board (W2 P1). board = 注入 + nemesis-web/board 管理面双开：
# nemesis-board 是 web 的 optional 依赖（rusqlite bundled 随它进出——iotsmall
# 里最后一个 SQLite 来源）；关 = `nemesisbot issue` CLI、board.* WSAPI、
# 看板资产端点与 nemesis-board 整包全部退出依赖图。
board = ["dep:nemesis-board", "nemesis-web/board"]
# 行动代理连接器数据面（2026-10-14 P0：connector_find/invoke 工具 +
# `nemesisbot connector` CLI + connectors.*/paperbroker.* WSAPI）。
# nemesis-security 被本 crate 无条件依赖（Ed25519 签名/信任库复用）——
# 关 = connectors 与 security 整包一并退出依赖图（iotsmall 白编译清零）。
connectors = ["dep:nemesis-connectors", "nemesis-web/connectors"]
# `nemesisbot eval` — prompt/skill behaviour assessment (needs the sandbox +
# security layers, the injector and the LLM proxy).
eval = ["sandbox", "security", "dep:nemesis-injector", "dep:nemesis-eval-proxy"]

# Frontend-only gate (no Rust code): controls the "使用统计" Dashboard page
# (UsageView) which pulls in echarts (~558KB). Off in minimal-iot → the page +
# echarts are tree-shaken from the embedded frontend. No-op on the Rust side.
usage = []

# L8 PTY 内嵌终端（dashboard 终端 tab；config terminal.enabled 默认关双闸）
terminal = ["nemesis-web/terminal"]

# 皮肤包（.nbskin）加载/签名验证/设置页管理面（ skins.rs 分发路由 +
# handlers/skins.rs WSAPI；nemesis-verify 依赖随 skins 进出）。关 =
# `/skins/*` 路由、WSAPI skins 模块、前端皮肤 tab 整体消失。
skins = ["nemesis-web/skins"]

# T2（L1 codemode）：code_run 脚本工具（rquickjs 随它进出；运行开关
# config agents.codemode.enabled 默认关——编译裁剪 + 运行双闸）。
codemode = ["nemesis-agent/codemode"]

# L9 版本自切换通道（`nemesisbot selfupdate check/apply/status` CLI + gateway
# 九步 apply 编排；v4 验签 + zip 解包 + 审批卡随 nemesis-web/selfupdate 进出）。
# implies security（审批 manager + 审计链是九步的两步）。
selfupdate = ["security", "nemesis-web/selfupdate"]

# 锁定版旗标（签名验证接入计划 §2.1）：纯编译期 cfg——verify_policy
# 据此把 enforce 烧死（config 任意值被忽略，启动自验失败 exit 86）。
# 锁定版必须能自验 → implies verify（无 verify 的构建没有可强制之物）。
# cargo feature 指纹原生跟踪，同 target 先消费后锁定无 stale（option_env!
# 方案的同 target 缓存复用坑）。
verify-enforce-lock = ["verify"]

# 启动签名自验（v4 Authenticode，verify_policy.rs + nemesis-verify 随它进出）。
# 关 = 启动自验消失（诚实 eprintln 跳过），WSAPI signature status 不注入；
# 皮肤验签（nemesis-web/skins 自带 nemesis-verify）与自切换验签不受影响。
# IoT/可信环境可关；锁定版（verify-enforce-lock）自动带回。
verify = ["dep:nemesis-verify"]

# 编译期内嵌价目表（~2800 条 LiteLLM 派生，+0.6MB）。关后价目查询/成本核算
# 空表降级（cost 恒 0.0 诚实口径），运行期下载层与自定义价目照常。
# IoT/极小镜像建议关。
pricing-embed = ["nemesis-data/pricing-embed"]

# 前端静态资源内嵌（include_dir，全量 ~2.9MB / 按 feature 裁剪前端后 ~1.2MB）。
# 关 = 只剩 exe 旁 static/ 目录的运行期磁盘兜底（没有则 Dashboard 页面 404）。
# IoT/无 Dashboard/纯 API 形态建议关。
web-static = []

# LSP 只读语义查询（definition/references/implementation/hover；lsp 工具 +
# 诊断回灌 diagnostics_loop + coding.lsp_install 随它进出，三 crate 穿透：
# nemesisbot/nemesis-agent/nemesis-web）。运行闸 config agents.lsp_tool
# （默认关）+ PATH 探测本来就关着，编译内含 ~0.2MB；IoT 建议关。
lsp = ["dep:nemesis-lsp", "nemesis-agent/lsp", "nemesis-web/lsp"]
# 2026-10-17 体积细粒度三件套（nemesis-agent 重依赖拆分）：
# checkpoint-git：D2 影子库（libgit2 ~1.5MB）；关 = checkpoint 恒 JSON 快照回落
# image-process：J6 图片降采样（~0.8MB）；关 = 超限图按原图链路（验真链照常把关）
# history-search：U20 FTS 会话检索；关 = 工具/CLI/WSAPI 诚实报未编译
#   （与 usage-store 一起构成 SQLite 拆分两半：账本本体随 usage-store 进出）
checkpoint-git = ["nemesis-agent/checkpoint-git", "nemesis-board/checkpoint-git"]
image-process = ["nemesis-agent/image-process"]
history-search = ["nemesis-agent/history-search", "nemesis-web/history-search"]

# SQLite 用量账本（nemesis-data 的 rusqlite bundled ~1MB，iotsmall 里最后
# 一个 SQLite 来源；history-search 只拆 FTS 检索面）。关 = DataStore 空账本
# stub（写入 no-op、查询恒空、JSON 价目层照常，open() warn 一次），生产
# 调用方零改动。测试构建经各消费 crate 的 [dev-dependencies] 带回真账本。
usage-store = ["nemesis-data/usage-store"]

# WASM 插件框架（`plugin` CLI + Dashboard 插件页 + agent 工具桥；guest 侧
# wasmtime 运行时随它进出）。关 = 无 WASM 插件子系统，`plugin.*` 工具与
# `plugins.wasm.*` WSAPI 整体消失。implies security：信任验签/审计链/
# 病毒扫描机制依赖 nemesis-security（nemesis-plugins-wasm 本身硬依赖）。
plugins-wasm = ["security", "dep:nemesis-plugins-wasm", "nemesis-web/plugins-wasm"]

# Channel backends (forwarded to nemesis-channels)
channels-web = ["nemesis-channels/web"]
channels-webhook = ["nemesis-channels/webhook"]
channels-rpc = ["nemesis-channels/rpc"]
channels-discord = ["nemesis-channels/discord"]
channels-telegram = ["nemesis-channels/telegram"]
channels-slack = ["nemesis-channels/slack"]
channels-feishu = ["nemesis-channels/feishu"]
channels-dingtalk = ["nemesis-channels/dingtalk"]
channels-onebot = ["nemesis-channels/onebot"]
channels-tencent = ["nemesis-channels/tencent"]
channels-email = ["nemesis-channels/email"]
channels-matrix = ["nemesis-channels/matrix"]
channels-irc = ["nemesis-channels/irc"]
channels-signal = ["nemesis-channels/signal"]
channels-mastodon = ["nemesis-channels/mastodon"]
channels-bluesky = ["nemesis-channels/bluesky"]
channels-whatsapp = ["nemesis-channels/whatsapp"]
# Wave 3（P25-P29）：五新通道，默认关。
channels-wecom = ["nemesis-channels/wecom"]
channels-mattermost = ["nemesis-channels/mattermost"]
channels-nostr = ["nemesis-channels/nostr"]
channels-mqtt = ["nemesis-channels/mqtt"]
channels-wechat = ["nemesis-channels/wechat"]
channels-websocket = ["nemesis-channels/websocket"]
channels-external = ["nemesis-channels/external"]
channels-maixcam = ["nemesis-channels/maixcam"]
channels-line = ["nemesis-channels/line"]

[dependencies]
nemesis-types = { workspace = true }
nemesis-prompts = { workspace = true }
nemesis-config = { workspace = true }
nemesis-security = { workspace = true, optional = true }
# P1 统一任务层：tasks.db（审批台账 SqliteApprovalJournal 挂 security 面，
# 集群侧 SqliteTaskStore 适配在 nemesis-cluster 内）。P2 起 agents 表成为
# 核心子系统（AgentManager 无 feature 门），依赖升级为必选——统一任务层
# 是全局地基，IoT 裁剪关不掉（与 board.db 的看板闸不同：agents 身份是
# 对话组的基础设施）。
nemesis-taskstore = { workspace = true }
# 行动代理 P0（2026-10-14）：connector 注册表核心（清单/registry/回执/预算/
# 纸面账本）。非 optional——connector_find/connector_invoke 随 security
# feature 门控注册，但 WSAPI 数据面（connectors.* handlers）与 CLI 查询
# （connector list/receipts）在无 security 组合也要能读回执/账本。
nemesis-connectors = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
nemesis-bus = { workspace = true }
nemesis-agent = { workspace = true }
nemesis-channels = { workspace = true }
nemesis-providers = { workspace = true }
nemesis-forge = { workspace = true, optional = true }
nemesis-skills = { workspace = true }
nemesis-workflow = { workspace = true, optional = true }
nemesis-memory = { workspace = true, optional = true }
nemesis-mcp = { workspace = true }
nemesis-observer = { workspace = true }
nemesis-tools = { workspace = true }
nemesis-services = { workspace = true }
nemesis-migrate = { workspace = true, optional = true }
nemesis-auth = { workspace = true, optional = true }
nemesis-cluster = { workspace = true, optional = true }
nemesis-web = { workspace = true }
# C5 (2026-09-04): LSP manager singleton lives in SharedResources — gateway
# shutdown_all + web server share the same Arc the LspTool registers with.
# LSP 只读语义查询（lsp feature 门控；穿透 nemesis-agent/lsp + nemesis-web/lsp）
nemesis-lsp = { workspace = true, optional = true }
nemesis-health = { workspace = true, optional = true }
nemesis-data = { workspace = true }
nemesis-heartbeat = { workspace = true, optional = true }
nemesis-cron = { workspace = true }
nemesis-board = { workspace = true, optional = true }
nemesis-state = { workspace = true }
nemesis-desktop = { workspace = true, optional = true }
nemesis-devices = { workspace = true, optional = true }
nemesis-voice = { workspace = true, optional = true }
nemesis-logger = { workspace = true }
nemesis-utils = { workspace = true }
# Z1 session fork: chat_log copy goes through the process-global path manager;
# the CLI verifies it agrees with the resolved home (refuses to half-fork).
nemesis-path = { workspace = true }
# Swarm M3（§5.4/D-5）：board_asset 工具的 HTTP 拉取走共享连接池。
nemesis-http-pool = { workspace = true }
# 签名验证接入（P0）：启动自验走 lib 直接验签（不走 DLL）。
# 签名验证（verify feature 门控：启动自验 verify_policy；skins/selfupdate
# 的验签走 nemesis-web 各自 feature 的 nemesis-verify，不受本门影响）
nemesis-verify = { workspace = true, optional = true }
# WASM 插件框架宿主运行时（plugins-wasm feature 门控；implies security，
# 并转发 nemesis-web 同名 feature 装配 plugins.wasm.* WSAPI 管理面）。
nemesis-plugins-wasm = { workspace = true, optional = true }
nemesis-sandbox = { workspace = true, optional = true }
nemesis-injector = { workspace = true, optional = true }
nemesis-eval-proxy = { workspace = true, optional = true }
serde_yaml = { workspace = true }
# 凭据 vault CLI（P0）：隐藏输入 secret/口令（全库首个隐藏输入依赖，不回显）
rpassword = "7"
regex = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# 插件 manifest 签名（plugin sign）：与 trust.rs strip/回填同引擎保证字节一致
toml_edit = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = "5"
which = "6"
reqwest = { workspace = true }
base64 = { workspace = true }
# 反向桥客户端（goal 一期批次二）：出站 ws 连中继 + access_check 哈希比对
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
# B9-1：vm_sync 打包项目树（bulk_write 分块进 VM）
tar = { workspace = true }
getrandom = "0.2"
async-trait = { workspace = true }
parking_lot = { workspace = true }
rustyline = "15"
include_dir = "0.7"
# 临时工作区目录（bin 主路径：forge_test_runner 行为回归/重放装配；CI 教训：
# 只声明在 dev-deps/cfg(windows) 会让 Linux bin 编译 E0433——bin 跨平台代码
# 引用的 crate 必须在主 [dependencies]）
tempfile = "3"

[build-dependencies]
chrono = { workspace = true }
winresource = "0.1"
# 锚注入（build.rs 三级优先级第 2 级：certs/root_cert.der 现算 SHA-256）
sha2 = { workspace = true }
# features.toml 解析 → 编译期嵌入「构建形态」清单（system.features WSAPI；
# 仅构建期消费，不进运行时依赖图）
toml = { workspace = true }
# emit_features_manifest 的 Deserialize derive
serde = { workspace = true }

[dev-dependencies]
# generate_image 工具落盘链路假端点（集群专业职能框架 M4）。
wiremock = "0.6"
# F2 回归锁（三轮复评 2026-10-21）：DB 删除失败注入用 SQLite 触发器
# （BEFORE DELETE RAISE）——需直接在测试里对 tasks.db 建触发器。
rusqlite = { workspace = true }
# P4 交付门测试夹具：真 git 仓 workspace（git2 已在依赖图内——nemesis-agent
# 影子库；此处只为测试可命名，不进 bin 依赖面）。
git2 = { workspace = true }
# usage-store 行为测试经 dev-dependencies 带回真 SQLite 账本（resolver 2：
# dev-dep features 不泄漏到正常构建——正常构建按需编译空账本 stub）。
nemesis-data = { workspace = true, features = ["usage-store"] }
# R9：子进程级测试（REPL 管道 stdin / eval 探测式真链路 / main 短路退码断言）
# 需要 resolve_nemesisbot_bin + run_cli_with_stdin + MockAiServer（scripted
# OpenAI 兼容回环服务器——TestAIServer 回复内容钉死，测不了工具选择/精确文本）。
test-harness = { path = "../test-tools/test-harness" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
