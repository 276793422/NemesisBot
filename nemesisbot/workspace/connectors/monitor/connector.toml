# 网页监控 connector（行动代理 P0 demo，域 A）
# 原语型：只提供「抓取网页」一个 op；定时监控剧本（cron 触发 → fetch →
# 与上次快照 diff → 有变化则通知）由 agent 推理驱动——用 cron 工具建
# 定时任务，每次运行调 watch 取当前内容并自行比对 workspace 里保存的
# 上次快照。
#
# watch 走 web_fetch 工具绑定：完整 dispatch 瀑布照跑（SSRF 闸照常生效，
# 回环/内网地址默认被拦）。

[connector]
id = "monitor"
name = "网页监控"
version = "0.1.0"
kind = "local"
description = "定时盯网页变化的 demo 原语：抓取指定 URL 内容，变化检测与通知由 agent 剧本驱动（配合 cron 工具）。"

[[op]]
id = "watch"
intent = ["看看网页", "抓一下页面", "监控的页面现在什么内容"]
risk = "low"
class = "network"
tool = "web_fetch"
args_schema = { type = "object", required = ["url"], properties = { url = { type = "string", description = "要抓取的完整 URL" } } }
